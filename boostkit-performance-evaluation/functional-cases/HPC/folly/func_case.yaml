# Folly 功能测试清单。
# 独立于性能测试框架;版本由人工指定,不做 latest 解析。
name: folly
category: HPC
enabled: true

# 人工指定的待测版本(白名单),对应上游 tag v<version>。
versions:
  - "2026.10.12.00"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  timeout_minutes: 240
  # C++ 库源码编译,需先装齐 boost/glog/gflags 等依赖。
  min_free_disk_gb: 10

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
checks:
  - name: version
    description: 检出源码的 tag 必须等于请求版本(v<version>)
  # folly 是纯 C++ 库(无 CLI),且自带单测依赖完整 GoogleTest 全量构建、过重。
  # 这里用上游公共 API(Conv/String/Range 等)编译并运行一个程序,作为上游功能判定。
  - name: upstream-test
    description: 编译并运行使用 folly 公共 API 的程序
  - name: link-smoke
    description: 最小头文件包含 + 链接 libfolly 的可用性验证

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  folly_test_log:
    path: folly_test.log
    stage: check
    format: text
    required: true