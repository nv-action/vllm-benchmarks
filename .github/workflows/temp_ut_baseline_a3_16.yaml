# TEMPORARY workflow: measure the release-lane UT baseline of CLEAN
# vllm-ascend main by PORTING main2main_flow's proven main-UT environment:
# vllm/vllm-ascend are NOT pip-installed — check_ut runs both lanes through
# its PYTHONPATH checkout duality (persistent venv with
# --system-site-packages + numpy==1.26.4, fake npu-smi, mocked torch_npu),
# which is exactly the env where the main lane runs 4190 tests green in
# production (run 34583706211). Install steps mirror schedule_main2main.yaml
# (mooncake wheel, requirements-dev.txt, triton-ascend) so the system site
# matches the flow's runner. The release-only failure set seeds
# main2main_flow's release_ut_baseline.json.
# Delete this file from both m2m-a3-16 and main after use.

name: Temp UT baseline (a3-16)

on:
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: temp-ut-baseline-a3-16
  cancel-in-progress: false

env:
  ARTIFACT_DIR: ut_baseline_artifacts

jobs:
  ut-baseline:
    runs-on: linux-aarch64-a3-16-sh-001
    timeout-minutes: 120
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12
      env:
        VLLM_LOGGING_LEVEL: ERROR
        VLLM_USE_MODELSCOPE: True
        HF_HUB_OFFLINE: 1
        UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
        UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu/"
        UV_INDEX_STRATEGY: unsafe-best-match
        UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
        UV_HTTP_TIMEOUT: 120
        UV_NO_CACHE: 1
        UV_SYSTEM_PYTHON: 1
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout vllm-project/vllm-ascend main
        uses: actions/checkout@v7
        with:
          repository: vllm-project/vllm-ascend
          ref: main
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Read pinned vllm versions
        id: pins
        run: |
          set -eu
          MAIN_PIN=$(cat .github/vllm-main-verified.commit)
          RELEASE_TAG=$(cat .github/vllm-release-tag.commit)
          echo "main pin:    ${MAIN_PIN}"
          echo "release tag: ${RELEASE_TAG}"
          echo "main_pin=${MAIN_PIN}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout vllm at main pin
        uses: actions/checkout@v7
        with:
          repository: vllm-project/vllm
          ref: ${{ steps.pins.outputs.main_pin }}
          path: vllm-upstream
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -eu
          sed -Ei 's@(ports|archive).ubuntu.com@cache-service.nginx-pypi-cache.svc.cluster.local:8081@g' /etc/apt/sources.list
          pip config set global.index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
          pip config set global.trusted-host cache-service.nginx-pypi-cache.svc.cluster.local
          apt-get update -y
          if [ -s "$GITHUB_WORKSPACE/packages.txt" ]; then
            xargs -r apt-get -y install < "$GITHUB_WORKSPACE/packages.txt"
          fi
          apt-get -y install git curl ca-certificates gcc g++ cmake libnuma-dev zstd
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/vllm-upstream"
          pip install uv pytest
          # Hide the nested vllm checkout from the ascend repo's git status.
          echo "vllm-upstream/" >> .git/info/exclude

      - name: Install main2main_flow and runner deps
        run: |
          set -euxo pipefail
          # Same system-site packages the flow's runner has; order mirrors
          # schedule_main2main.yaml.
          apt-get install -y --no-install-recommends \
            libibverbs1 ibverbs-providers librdmacm1 libcurl4
          ldconfig
          MOONCAKE_WHEEL="mooncake_transfer_engine_ascend-0.3.9-cp312-cp312-manylinux_2_35_aarch64.whl"
          pip install --no-cache-dir --no-deps \
            "https://vllm-ascend.obs.cn-north-4.myhuaweicloud.com/vllm-ascend/${MOONCAKE_WHEEL}"
          # The vllm install provides the dependency closure (cbor2 etc.)
          # for the UT venv — check_ut's PYTHONPATH shadows the package
          # itself with the pinned checkout trees.
          (cd vllm-upstream && VLLM_TARGET_DEVICE=empty uv pip install .)
          pip uninstall -y triton
          pip install uc-manager
          uv pip install -r requirements-dev.txt
          uv pip install --force-reinstall --no-deps triton-ascend==3.2.2
          # Registers vllm_ascend's platform-plugin entry points (production
          # has them); the PYTHONPATH ascend tree shadows the package code.
          SOC_VERSION=ascend910_9391 COMPILE_CUSTOM_KERNELS=0 uv pip install -e .
          # main2main_flow provides check_ut (the dual-lane UT runner).
          git clone --depth 1 https://github.com/vllm-ascend/main2main_flow.git \
            /tmp/main2main_flow
          pip install -e /tmp/main2main_flow

      - name: Prepare vllm release worktree
        run: |
          set -eu
          RELEASE_TAG="${{ steps.pins.outputs.release_tag }}"
          # fetch is a no-op on the full checkout; kept to mirror the flow's
          # _prepare_release_worktree (shallow clones lack the tag).
          git -C vllm-upstream fetch --depth 1 origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" || true
          git -C vllm-upstream worktree add -f --detach \
            /tmp/vllm-release "${RELEASE_TAG}"
          git -C vllm-upstream worktree list

      - name: Run dual-lane UT baseline (flow check_ut)
        env:
          RELEASE_TAG: ${{ steps.pins.outputs.release_tag }}
        run: |
          python - <<'PYEOF'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          os.environ["MAIN2MAIN_RELEASE_UT_BASELINE"] = "0"

          from main2main_flow.scripts.utils.ut_check import check_ut

          ascend = Path(os.environ["GITHUB_WORKSPACE"])
          vllm = ascend / "vllm-upstream"
          release = Path("/tmp/vllm-release")
          tag = os.environ["RELEASE_TAG"]
          art = Path(os.environ["ARTIFACT_DIR"])
          art.mkdir(exist_ok=True)

          res = check_ut(ascend, vllm_path=vllm,
                         vllm_release_path=release, release_tag=tag)

          # Violations carry a "[<label>] " prefix: label "main" for the
          # main lane, the tag (v-stripped) for the release lane — and the
          # string continues past the first line (failure excerpt), so the
          # lane must be split with startswith, never an anchored regex.
          # Extract the node id (the token after FAILED/ERROR) for stable
          # baseline keys.
          node_re = re.compile(r"(?:FAILED|ERROR)\s+(\S+)")
          main_prefix, rel_prefix = "[main] ", f"[{tag.lstrip('v')}] "
          main_fails, rel_fails, unparsed = [], [], []
          for v in res["violations"]:
              if v.startswith(rel_prefix):
                  body, lane = v[len(rel_prefix):], rel_fails
              elif v.startswith(main_prefix):
                  body, lane = v[len(main_prefix):], main_fails
              else:
                  unparsed.append(v)
                  continue
              nm = node_re.search(body)
              if nm:
                  lane.append(nm.group(1))
              else:
                  unparsed.append(v)
          release_only = sorted(set(rel_fails) - set(main_fails))
          both = sorted(set(rel_fails) & set(main_fails))
          main_only = sorted(set(main_fails) - set(rel_fails))

          (art / "release_ut_baseline.json").write_text(
              json.dumps({"excluded": release_only}, indent=2) + "\n",
              encoding="utf-8")
          (art / "ut_baseline_result.json").write_text(json.dumps({
              "detail": res["detail"], "skipped": res.get("skipped", False),
              "main_failures": main_fails, "release_failures": rel_fails,
              "unparsed_violations": unparsed}, indent=2) + "\n",
              encoding="utf-8")
          log = res.get("log_path", "")
          if log and Path(log).exists():
              shutil.copy(log, art / "ut_full.log")

          def fmt(entries):
              return "\n".join(f"- `{e}`" for e in entries) or "- (none)"

          report = "\n".join([
              "# UT baseline report (flow check_ut, clean vllm-ascend main)",
              f"- detail: {res['detail']}",
              "",
              f"## Release-only failures ({len(release_only)}) — "
              f"release_ut_baseline.json candidates",
              fmt(release_only),
              "",
              f"## Both lanes ({len(both)}) — env noise, NOT baseline candidates",
              fmt(both),
              "",
              f"## Main-only failures ({len(main_only)}) — should be EMPTY "
              f"(main lane is green in the flow env)",
              fmt(main_only),
              "",
              f"## Unparsed violations ({len(unparsed)})",
              "\n".join(f"- {v}" for v in unparsed) or "- (none)",
          ]) + "\n"
          (art / "baseline_report.md").write_text(report, encoding="utf-8")
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a",
                    encoding="utf-8") as f:
              f.write(report)
          PYEOF

      - name: Upload baseline artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ut-baseline-${{ github.run_id }}
          path: ${{ env.ARTIFACT_DIR }}
          retention-days: 7
