# TEMPORARY: prove the actionlint deadlock is the pre-Start stdin write
# against a pipe squeezed to 4 KiB by fs.pipe-user-pages-soft.
#
# actionlint v1.7.11 (store rev 393031a) does, in cmdExecution.run():
#     p, _ := cmd.StdinPipe()
#     io.WriteString(p, e.stdin)   // whole script, BEFORE Start()
#     p.Close()
#     cmd.Output()                 // this is what calls Start()
# The kernel pipe must absorb the entire script before any reader exists.
# Default pipe capacity is 64 KiB, but Linux gives new pipes only ONE page
# (4 KiB) once the user exceeds fs.pipe-user-pages-soft.  The soft limit is
# accounted per user_struct, i.e. host-wide for root across all containers,
# which explains why production is intermittent: some attempts get 64 KiB
# pipes, some get 4 KiB pipes, and any workflow step body > 4 KiB then
# blocks forever with no shellcheck child ever spawned.
#
# Upstream fixed this in main (2016... commit after v1.7.12; issue #651,
# closed 2026-04-19) by using cmd.Stdin = strings.NewReader(e.stdin).
# v1.7.12 (2026-03-30) is the newest release and still has the bug.
#
# Experiments (all with the production binary repoxqgigsmc = v1.7.11):
#   A. one file, no pressure                         -> expect pass
#   B. same file, pipes exhausted to 4 KiB           -> expect hang
#   C. same + -shellcheck= (also under pressure)     -> expect pass
#   D. same + taskset to 2 CPUs (under pressure)     -> expect hang
#      (rules out "just lower NumCPU" as a mitigation)
#   E. same file after pressure released             -> expect pass again
name: 'temp: actionlint pipe 4'

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/temp_actionlint_pipe4.yaml

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: pipe-budget deadlock (a3-16)
    runs-on: linux-aarch64-a3-16-sh-001
    timeout-minutes: 20
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12
      env:
        PRE_COMMIT_HOME: /root/.cache/main2main-pre-commit-a3-16-aarch64
        PYTHONUNBUFFERED: "1"
    steps:
      - name: Install shellcheck and clone vllm-ascend
        run: |
          set -eu
          if ! command -v shellcheck >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq shellcheck
          fi
          shellcheck --version | sed -n '1,3p'
          rm -rf /tmp/ascend
          timeout 300 git clone --depth 1 https://github.com/vllm-project/vllm-ascend.git /tmp/ascend
          git config --global --add safe.directory /tmp/ascend
          git -C /tmp/ascend log -1 --format='%H %ci %s'

      - name: Kernel pipe budget and production binary
        run: |
          set +e
          echo "nproc=$(nproc)"
          echo "ulimit_n=$(ulimit -n)"
          echo "cpus_allowed=$(awk '/Cpus_allowed_list/{print $2}' /proc/self/status)"
          echo "pipe-user-pages-soft=$(cat /proc/sys/fs/pipe-user-pages-soft)"
          echo "pipe-user-pages-hard=$(cat /proc/sys/fs/pipe-user-pages-hard)"
          echo "pipe-max-size=$(cat /proc/sys/fs/pipe-max-size)"
          python3 - <<'EOF'
          import fcntl, os
          r, w = os.pipe()
          print("fresh_pipe_sz", fcntl.fcntl(r, 1032))
          os.close(r); os.close(w)
          EOF
          BIN="$PRE_COMMIT_HOME/repoxqgigsmc/golangenv-default/bin"
          echo "BIN=$BIN"
          ls -la "$BIN/actionlint"
          "$BIN/actionlint" -version
          cd /tmp/ascend
          F=.github/workflows/pr_nightly_command.yml
          echo "file=$F exists=$([ -f "$F" ] && echo yes || echo no) bytes=$(wc -c < "$F" 2>/dev/null)"

      - name: Deadlock under pipe pressure
        run: |
          set +e
          cd /tmp/ascend
          BIN="$PRE_COMMIT_HOME/repoxqgigsmc/golangenv-default/bin"
          export PATH="$BIN:$PATH"
          F=.github/workflows/pr_nightly_command.yml
          CPUS=$(awk '/Cpus_allowed_list/{print $2}' /proc/self/status)
          FIRST=$(printf '%s' "$CPUS" | cut -d, -f1 | cut -d- -f1)
          TASKSET_RANGE="${FIRST}-$((FIRST + 1))"
          echo "taskset_range=$TASKSET_RANGE"

          echo "== A: no pressure, shellcheck on =="
          start=$SECONDS
          timeout -k 5 30 actionlint "$F"
          echo "NO_PRESSURE_RC=$? elapsed=$((SECONDS - start))s"

          echo "== exhausting the pipe budget =="
          rm -f /tmp/pipe_ready
          python3 - <<'EOF' &
          import fcntl, os, resource, time

          try:
              soft, hard = resource.getrlimit(resource.RLIMIT_NOFILE)
              resource.setrlimit(resource.RLIMIT_NOFILE, (min(hard, 65536), hard))
              print("rlimit_nofile", resource.getrlimit(resource.RLIMIT_NOFILE), flush=True)
          except Exception as e:
              print("rlimit_nofile_failed", e, flush=True)

          F_GET, F_SET = 1032, 1031
          maxsz = int(open('/proc/sys/fs/pipe-max-size').read())
          held = []
          pages = 0
          shrink = None
          i = 0
          while i < 6000:
              try:
                  r, w = os.pipe()
              except OSError as e:
                  print(f"OSError after {i} pipes, pages={pages}: {e}", flush=True)
                  break
              try:
                  fcntl.fcntl(r, F_SET, min(maxsz, 1 << 20))
              except OSError:
                  pass
              cap = fcntl.fcntl(r, F_GET)
              os.set_blocking(w, False)
              try:
                  os.write(w, b'x' * cap)
              except BlockingIOError:
                  pass
              held.append((r, w))
              pages += cap // 4096
              i += 1
              r2, w2 = os.pipe()
              s2 = fcntl.fcntl(r2, F_GET)
              os.close(r2); os.close(w2)
              if s2 == 4096:
                  shrink = i
                  print(f"PIPE_SHRUNK after {i} pipes, held_pages~{pages}, new_pipe_sz={s2}", flush=True)
                  break
          if shrink is None:
              print(f"PIPE_NOT_SHRUNK held={i} pages~{pages}", flush=True)
          with open('/tmp/pipe_ready', 'w') as f:
              f.write(str(i))
          time.sleep(180)
          EOF
          HOLDER=$!
          for _ in $(seq 1 90); do
            [ -f /tmp/pipe_ready ] && break
            sleep 1
          done
          echo "holder_pipes=$(cat /tmp/pipe_ready 2>/dev/null)"
          echo "holder_alive=$(kill -0 $HOLDER 2>/dev/null && echo yes || echo no)"

          echo "== B: under pressure, shellcheck on =="
          start=$SECONDS
          timeout -k 5 30 actionlint "$F"
          echo "PRESSURE_SHC_RC=$? elapsed=$((SECONDS - start))s"

          echo "== C: under pressure, shellcheck disabled =="
          start=$SECONDS
          timeout -k 5 30 actionlint -shellcheck= "$F"
          echo "PRESSURE_NOSHC_RC=$? elapsed=$((SECONDS - start))s"

          echo "== D: under pressure, 2 CPUs only =="
          start=$SECONDS
          taskset -c "$TASKSET_RANGE" timeout -k 5 30 actionlint "$F"
          echo "PRESSURE_TASKSET_RC=$? elapsed=$((SECONDS - start))s"

          echo "== releasing pressure =="
          kill -9 $HOLDER 2>/dev/null
          wait $HOLDER 2>/dev/null
          sleep 2
          python3 - <<'EOF'
          import fcntl, os
          r, w = os.pipe()
          print("fresh_pipe_sz_after_release", fcntl.fcntl(r, 1032))
          os.close(r); os.close(w)
          EOF

          echo "== E: after release, shellcheck on =="
          start=$SECONDS
          timeout -k 5 30 actionlint "$F"
          echo "AFTER_RELEASE_RC=$? elapsed=$((SECONDS - start))s"

      - name: Leftovers
        if: always()
        run: |
          ps -ef | grep -E 'actionlint|shellcheck' | grep -v grep || echo "(none left)"
