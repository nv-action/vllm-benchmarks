name: Quay Permission Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Push scratch image to validation registry
    runs-on: linux-amd64-cpu-4
    steps:
      - uses: actions/checkout@v7

      - name: Login to validation registry
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_TEMP_USERNAME }}
          password: ${{ secrets.QUAY_TEMP_PASSWORD }}

      - name: Push permission probe
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/workflows/dockerfiles/Dockerfile.probe
          push: true
          tags: quay.io/wjunlu/vllm-ascend-workflow:permission-probe
