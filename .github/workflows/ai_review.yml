name: AI Review sandbox diagnostics
on:
  pull_request_target:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      github.repository == 'nv-action/vllm-benchmarks' &&
      github.event.pull_request.number == 431 &&
      github.event.label.name == 'ai-review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.sha == '852695b9afac1b1098e2f4d0b8857fe09d194064' &&
      github.event.pull_request.head.ref == 'ai-review-debug/sandbox'
    runs-on: linux-amd64-cpu-4-hk
    timeout-minutes: 20
    container:
      image: quay.io/ascend-ci/vllm-ascend:ai-review
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/scripts
            .github/agent-review/allowlist.txt
          sparse-checkout-cone-mode: false

      - name: Authorize the event before it can affect a running review
        id: authorize
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/workflows/scripts/ai_review.py authorize

  review:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: linux-amd64-cpu-4-hk
    timeout-minutes: 20
    container:
      image: quay.io/ascend-ci/vllm-ascend:ai-review
    concurrency:
      group: ai-review-debug-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the review
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .github/workflows/scripts/ai_review.py prepare

      - uses: actions/checkout@v7
        if: steps.prepare.outputs.review == 'true'
        with:
          ref: ${{ steps.prepare.outputs.head }}
          path: head
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - uses: actions/checkout@v7
        if: steps.prepare.outputs.review == 'true'
        with:
          ref: ${{ steps.prepare.outputs.base }}
          path: base
          persist-credentials: false

      - name: Verify the model can run Git through Bash
        if: steps.prepare.outputs.review == 'true'
        env:
          AI_REVIEW_KEY: ${{ secrets.AI_REVIEW_KEY }}
          AI_REVIEW_API: ${{ secrets.AI_REVIEW_API }}
          AI_REVIEW_MODEL: deepseek-v4.1-flash
          AI_REVIEW_DSH_CMD: dsh --profile headless
        run: python3 .github/workflows/scripts/probe_model_git_access.py
