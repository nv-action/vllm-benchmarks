name: AI Review sandbox diagnostics
on:
  pull_request_target:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      github.event.label.name == 'ai-review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ai-review-debug/sandbox'
    runs-on: linux-amd64-cpu-4-hk
    timeout-minutes: 20
    container:
      image: quay.io/ascend-ci/vllm-ascend:ai-review
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/scripts
            .github/agent-review/allowlist.txt
          sparse-checkout-cone-mode: false

      - name: Authorize the event before it can affect a running review
        id: authorize
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/workflows/scripts/ai_review.py authorize

  review:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: linux-amd64-cpu-4-hk
    timeout-minutes: 120
    container:
      image: quay.io/ascend-ci/vllm-ascend:ai-review
    concurrency:
      group: ai-review-debug-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the review
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .github/workflows/scripts/ai_review.py prepare

      - uses: actions/checkout@v7
        if: steps.prepare.outputs.review == 'true'
        with:
          ref: ${{ steps.prepare.outputs.head }}
          path: head
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - uses: actions/checkout@v7
        if: steps.prepare.outputs.review == 'true'
        with:
          ref: ${{ steps.prepare.outputs.base }}
          path: base
          persist-credentials: false

      - name: Hold for debugging
        if: steps.prepare.outputs.review == 'true'
        run: |
          pwd
          for checkout in . head base; do
            printf '%s ' "$checkout"
            git -c safe.directory="$(realpath "$checkout")" -C "$checkout" rev-parse HEAD
          done
          exec sleep infinity
