        env:
          OBS_ACCESS_KEY: ${{ secrets.OBS_ACCESS_KEY_ID }}
          OBS_SECRET_KEY: ${{ secrets.OBS_SECRET_ACCESS_KEY }}
        run: |
          python3 - <<'EOF'
          import os, glob
          from obs import ObsClient
          OBS_BUCKET = 'ascend-artifcat-packages'
          OBS_PLATFORM_ROOT = 'pypi/packages/ascend/repos/pypi/platforms'
          platform_wheels = sorted(glob.glob('all-wheels/platforms/*/*.whl'))
          if not platform_wheels:
              raise Exception('No per-platform wheels found; expected all-wheels/platforms/*/*.whl')
          client = ObsClient(
              access_key_id=os.environ['OBS_ACCESS_KEY'],
              secret_access_key=os.environ['OBS_SECRET_KEY'],
              server='https://obs.cn-north-4.myhuaweicloud.com'
          )
          for file in platform_wheels:
              platform = os.path.basename(os.path.dirname(file))
              object_key = f'{OBS_PLATFORM_ROOT}/{platform}/vllm-ascend/{os.path.basename(file)}'
              resp = client.putFile(OBS_BUCKET, object_key, file)
              if resp.status < 300:
                  print(f'Uploaded: {object_key}')
              else:
                  raise Exception(f'Failed to upload {object_key}: {resp.errorMessage}')
          EOF
