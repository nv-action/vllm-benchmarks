on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag for build results'
        default: main
        required: true
        type: choice
        options:
          - main
          - v0.30.0
          - v0.26.0rc1
          - v0.23.0
          - v0.23.0rc1
          - v0.22.1rc1
          - v0.21.0rc1
          - v0.20.2rc1

