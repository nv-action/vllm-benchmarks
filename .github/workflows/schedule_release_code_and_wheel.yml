  build_and_release_wheel_a3:
    name: build and release wheel (A3)
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout vllm-ascend
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: checkout vllm-ascend ${{ inputs.tag }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          repository: vllm-project/vllm-ascend
          submodules: recursive
          ref: ${{ inputs.tag }}

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Build wheel
        run: |
          ls
          docker build -f ./.github/workflows/dockerfiles/Dockerfile.buildwheel.a3 \
          --build-arg PY_VERSION=${{ matrix.python-version }} \
          -t wheel-a3:v1 .
          # Bypass the base image entrypoint: it sources ascendnpu-ir/set_env.sh,
          # which is unreadable for non-root users in the CANN 9.2.1 images.
          docker run --rm \
          --entrypoint /bin/bash \
          -u "$(id -u):$(id -g)" \
          -v "$(pwd):/outpwd" \
          wheel-a3:v1 \
          -c "cp -r /workspace/vllm-ascend/dist /outpwd"
          ls dist

      - name: Keep libgomp out of the A3 wheel
        run: |
          # auditwheel bundles the runner's libgomp (ubuntu-24.04, glibc 2.39,
          # references GLIBC_2.38 __isoc23_* symbols) into the A3 wheel, which
          # silently promotes the tag from manylinux_2_34 to manylinux_2_38
          # although the wheel is built inside a manylinux_2_34 image. Exclude
          # it so the OpenMP runtime is taken from the target system, keeping
          # A3 consistent with the A2/310P/950 wheels.
          # This has to run after "Build wheel": patching the tree earlier would
          # make setuptools_scm append a local version and change the wheel name.
          if ! grep -qF '"libgomp*"' .github/workflows/scripts/wheel/auto_exclude.py; then
            sed -i 's|^    "libgcc_s.so",$|    "libgcc_s.so",\n    "libgomp*",|' \
              .github/workflows/scripts/wheel/auto_exclude.py
          fi
          grep -nF '"libgomp*"' .github/workflows/scripts/wheel/auto_exclude.py

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Repair wheels with auditwheel
        run: |
          python3 -m pip install auditwheel patchelf
          python3 .github/workflows/scripts/wheel/auto_exclude.py dist
          ls dist

      - name: Verify automatic platform tags
        run: |
          cd dist
          for wheel in *.whl; do
            echo "verification file: $wheel"
            auditwheel show "$wheel"
          done

      # Variant (WheelNext) wheels are already published by wheelnext, so this run
      # only produces and uploads the plain per-platform wheels below.
      # - name: Generate variant wheels
      #   env:
      #     WHEEL_FILE: dist
      #     PROJECT_TOML: .github/workflows/scripts/wheel/pyproject.toml
      #     OUTPUT_DIR: dist/variants
      #     VARIANT_LABEL: a3
      #   run: |
      #     pip install build git+https://github.com/wheelnext/variantlib.git@67a62d53fb8b5a91334d9632bc7d1546ee67349e --quiet
      #     mkdir -p dist/variants
      #     python3 .github/workflows/scripts/wheel/make_variant.py \
      #       -c .github/workflows/scripts/wheel/config.json \
      #       -l "${VARIANT_LABEL}"
      #     echo "Generated variant wheels:"
      #     ls dist/variants/

      - name: Stage per-platform wheels
        env:
          PLATFORM: a3
        run: |
          # Reuse the non-variant wheel built for this platform as the plain wheel
          # published to the per-platform pip directory (platforms/ on the mirror).
          mkdir -p "dist/platforms/${PLATFORM}"
          cp dist/*.whl "dist/platforms/${PLATFORM}/"
          echo "Staged plain wheels for platform ${PLATFORM}:"
          ls "dist/platforms/${PLATFORM}/"

      - name: Archive wheel
        uses: actions/upload-artifact@v7
        with:
          name: vllm-ascend-a3-${{ matrix.os }}-py${{ matrix.python-version }}-wheel
          path: dist/


