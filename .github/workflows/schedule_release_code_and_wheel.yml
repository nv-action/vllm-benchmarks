name: Diagnose A5 rc2 optiling

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check available disk space
        run: df -h /
      - name: Inspect the exact failed A5 image
        run: |
          docker run --rm -i --entrypoint "" \
            quay.io/ascend/manylinux:9.2.0-950-manylinux_2_34-py3.11@sha256:5d5aec47c2de83c0aa68062f85f6edf9d07eea2d864137394a72e63c93a3f0e5 \
            bash -c 'source /usr/local/Ascend/ascend-toolkit/set_env.sh && source /usr/local/Ascend/nnal/atb/set_env.sh && export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/$(uname -i)-linux/devlib" && python3 -' <<'PY'
          import ctypes
          import os
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(os.environ['ASCEND_HOME_PATH']).resolve()
          print('CANN_ROOT:', root, flush=True)
          print('LD_LIBRARY_PATH:', os.environ['LD_LIBRARY_PATH'], flush=True)
          print('COMPILER_VERSION:', (root / 'compiler/version.info').read_text(), flush=True)
          for child in sorted(root.iterdir()):
              print('CANN_ENTRY:', child, 'TARGET:', child.resolve(), 'SYMLINK:', child.is_symlink(), flush=True)
          seen = set()
          paths = []
          for folder, subdirs, files in os.walk('/usr/local/Ascend', followlinks=True):
              real = os.path.realpath(folder)
              if real in seen:
                  subdirs[:] = []
                  continue
              seen.add(real)
              for name in files:
                  if name.startswith('liboptiling') and '.so' in name:
                      paths.append(pathlib.Path(folder) / name)
          paths.sort()
          print('OPTILING_FILES:', len(paths), flush=True)
          for path in paths:
              print('FILE:', path, 'TARGET:', path.resolve(), 'EXISTS:', path.exists(), flush=True)
          for library in ['liboptiling.so'] + [str(path) for path in paths if path.exists()]:
              try:
                  ctypes.CDLL(library)
                  print('LOAD_OK:', library, flush=True)
              except OSError as error:
                  print('LOAD_ERROR:', library, str(error), flush=True)
          dirs = sorted({str(path.parent) for path in paths if path.exists()})
          env = dict(os.environ, LD_LIBRARY_PATH=':'.join(dirs + [os.environ['LD_LIBRARY_PATH']]))
          result = subprocess.run([sys.executable, '-c', 'import ctypes; ctypes.CDLL("liboptiling.so"); print("EXTRA_PATH_LOAD_OK")'], env=env, check=False)
          print('EXTRA_PATH_RESULT:', result.returncode, flush=True)
          for folder in dirs:
              env = dict(os.environ, LD_LIBRARY_PATH=folder + ':' + os.environ['LD_LIBRARY_PATH'])
              result = subprocess.run([sys.executable, '-c', 'import ctypes; ctypes.CDLL("liboptiling.so")'], env=env, check=False, capture_output=True, text=True)
              print('SINGLE_DIR:', folder, 'RESULT:', result.returncode, 'ERROR:', result.stderr.strip(), flush=True)
          PY
