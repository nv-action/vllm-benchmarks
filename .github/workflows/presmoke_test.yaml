name: CANN SMOKE TEST

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash -el {0}


jobs:

  run_smoke:
    name: cann_smoke
    runs-on: linux-aarch64-a3-2
    container: quay.io/canuunac/cann:9.2.1-a3-ubuntu24.04-py3.12

    steps:
      - name: Check NPU availability && Check driver && CANN version
        run: |
          npu-smi info
          echo "==== Driver ===="
          cat /usr/local/Ascend/driver/version.info || echo "driver not mounted"
          echo "==== CANN ===="
          cat /usr/local/Ascend/ascend-toolkit/latest/version.cfg      
      - name: smoke
        run: |
          python3 -c "import acl;print(acl.get_soc_name())"