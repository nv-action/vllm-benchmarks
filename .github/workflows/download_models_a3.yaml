name: Temp Model Download (a3-16 cache)

# TEMPORARY: pre-seed the runner's persistent /root/.cache/modelscope hub
# cache with models the 12-case suite needs but the volume lacks (run
# 33944487577: test_vlm audio and test_disaggregated_encoder failed with
# "Cannot find the requested files in the cached path" under
# HF_HUB_OFFLINE=1; test_gemma4's model was never attempted because the
# case died earlier on occupied chips).  modelscope<1.38 keeps the legacy
# hub/models/{org}/{name} cache layout the offline e2e jobs read; install
# it in an isolated venv so the image's vllm-deps modelscope is untouched.
# Delete this file once the models are verified present.

on:
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

jobs:
  download-models:
    runs-on: linux-aarch64-a3-16-sh-001
    timeout-minutes: 240
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12
    steps:
      - name: Install modelscope<1.38 in an isolated venv
        run: |
          set -euxo pipefail
          python3 -m venv /tmp/msdl_venv
          /tmp/msdl_venv/bin/pip install -q \
            -i https://repo.huaweicloud.com/repository/pypi/simple \
            "modelscope<1.38"
          /tmp/msdl_venv/bin/python -c \
            "import modelscope; print('modelscope', modelscope.__version__)"

      - name: Download missing models into the default modelscope cache
        run: |
          set -uxo pipefail
          /tmp/msdl_venv/bin/python - <<'PY'
          import sys, traceback
          from modelscope import snapshot_download
          MODELS = [
              "openai-mirror/whisper-large-v3-turbo",
              "google/gemma-4-26B-A4B-it",
              "Qwen/Qwen2.5-VL-7B-Instruct",
          ]
          failed = []
          for m in MODELS:
              try:
                  p = snapshot_download(m)
                  print(f"[OK] {m} -> {p}", flush=True)
              except Exception as e:
                  print(f"[FAILED] {m}: {e}", flush=True)
                  traceback.print_exc()
                  failed.append(m)
          if failed:
              sys.exit(f"model download failed: {failed}")
          PY

      - name: Verify cache layout
        if: always()
        run: |
          du -sh /root/.cache/modelscope/hub/models/openai-mirror/whisper-large-v3-turbo \
                 /root/.cache/modelscope/hub/models/google/gemma-4-26B-A4B-it \
                 /root/.cache/modelscope/hub/models/Qwen/Qwen2.5-VL-7B-Instruct || true
