name: Temp Model Download (a3-16 cache)

# TEMPORARY: pre-seed the runner's persistent /root/.cache with the assets
# the 11-case suite needs but the volume lacks (run 34018086282:
# test_qwen3_8b_w8a8 eagle3 draft model, test_vlm test_multimodal_audio
# model + audio assets, and test_disaggregated_encoder's modelscope
# master-revision record all failed under HF_HUB_OFFLINE=1).  modelscope
# <1.38 keeps the legacy hub/models/{org}/{name} cache layout the offline
# e2e jobs read; install it in an isolated venv so the image's vllm-deps
# modelscope is untouched.  gemma-4 is gone from the policy (killed
# 2026-09-06) and is NOT downloaded anymore.  Delete this file once the
# models are verified present.

on:
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

jobs:
  download-models:
    runs-on: linux-aarch64-a3-16-sh-001
    timeout-minutes: 240
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12
    steps:
      - name: Install modelscope<1.38 in an isolated venv
        run: |
          set -euxo pipefail
          python3 -m venv /tmp/msdl_venv
          /tmp/msdl_venv/bin/pip install -q \
            -i https://repo.huaweicloud.com/repository/pypi/simple \
            "modelscope<1.38"
          /tmp/msdl_venv/bin/python -c \
            "import modelscope; print('modelscope', modelscope.__version__)"

      - name: Download missing models into the default modelscope cache
        run: |
          set -uxo pipefail
          /tmp/msdl_venv/bin/python - <<'PY'
          import sys, traceback
          from modelscope import snapshot_download
          MODELS = [
              # re-run rewrites the master revision record the disagg
              # encoder test's offline snapshot_download needs
              "Qwen/Qwen2.5-VL-7B-Instruct",
              "openai-mirror/whisper-large-v3-turbo",
              "RedHatAI/Qwen3-8B-speculator.eagle3",
              "Qwen/Qwen2-Audio-7B-Instruct",
          ]
          failed = []
          for m in MODELS:
              try:
                  p = snapshot_download(m)
                  print(f"[OK] {m} -> {p}", flush=True)
              except Exception as e:
                  print(f"[FAILED] {m}: {e}", flush=True)
                  traceback.print_exc()
                  failed.append(m)
          if failed:
              sys.exit(f"model download failed: {failed}")
          PY

      - name: Prefetch vllm public audio assets
        run: |
          set -uxo pipefail
          mkdir -p /root/.cache/vllm/vllm_public_assets
          cd /root/.cache/vllm/vllm_public_assets
          for a in mary_had_lamb winning_call; do
            curl -fsSL --retry 5 --retry-delay 3 -o "$a.ogg" \
              "https://vllm-public-assets.s3.us-west-2.amazonaws.com/multimodal_asset/$a.ogg"
            ls -la "$a.ogg"
          done

      - name: Verify cache layout
        if: always()
        run: |
          du -sh /root/.cache/modelscope/hub/models/Qwen/Qwen2_5-VL-7B-Instruct \
                 /root/.cache/modelscope/hub/models/Qwen/Qwen2___5-VL-7B-Instruct \
                 /root/.cache/modelscope/hub/models/openai-mirror/whisper-large-v3-turbo \
                 /root/.cache/modelscope/hub/models/RedHatAI/Qwen3-8B-speculator.eagle3 \
                 /root/.cache/modelscope/hub/models/Qwen/Qwen2-Audio-7B-Instruct \
                 /root/.cache/vllm/vllm_public_assets || true
