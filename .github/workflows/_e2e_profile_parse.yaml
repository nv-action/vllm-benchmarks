name: Parse nightly profiling artifacts

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      image:
        required: true
        type: string
      prefix:
        required: true
        type: string
      display_name:
        required: true
        type: string
      ref:
        required: true
        type: string
      should_run:
        required: true
        type: boolean
    secrets:
      OBS_ACCESS_KEY_ID:
        required: false
      OBS_SECRET_ACCESS_KEY:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

defaults:
  run:
    shell: bash -el {0}

jobs:
  prepare:
    name: Plan ${{ inputs.display_name }}
    if: ${{ inputs.should_run }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    container:
      image: ${{ inputs.image }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout profiling source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: profile-source

      - name: Plan profile parser shards
        id: plan
        working-directory: profile-source
        env:
          AWS_ACCESS_KEY_ID: ${{ github.repository_owner == 'vllm-project' && secrets.OBS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ github.repository_owner == 'vllm-project' && secrets.OBS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          PROFILE_KEY_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          python3 -c 'import boto3' 2>/dev/null || python3 -m pip install --quiet boto3
          python3 -m pip install --quiet esdk-obs-python || true
          python3 -m tools.profile storage || true
          python3 -m tools.profile plan \
            --root /tmp/profile_plan \
            --prefix "$PROFILE_KEY_PREFIX" \
            --plan-output /tmp/profile_plan/matrix.json
          echo "matrix=$(cat /tmp/profile_plan/matrix.json)" >> "$GITHUB_OUTPUT"

  parse:
    name: ${{ inputs.display_name }} / node-${{ matrix.node_index }}
    needs: [prepare]
    if: needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240
    container:
      image: ${{ inputs.image }}
    steps:
      - name: Checkout profiling source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: profile-source

      - name: Parse ranks with concurrent compression and upload
        working-directory: profile-source
        env:
          AWS_ACCESS_KEY_ID: ${{ github.repository_owner == 'vllm-project' && secrets.OBS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ github.repository_owner == 'vllm-project' && secrets.OBS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          PROFILE_KEY_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          echo '========== Profiling offline parse =========='
          echo "Node shard: ${{ matrix.node_index }}"
          echo "Available CPUs: $(nproc)"
          free -h
          df -h /tmp
          python3 -c 'import boto3' 2>/dev/null || python3 -m pip install --quiet boto3
          python3 -m tools.profile parse \
            --root /tmp/profile_parse/node-${{ matrix.node_index }} \
            --prefix "$PROFILE_KEY_PREFIX" \
            --node-index ${{ matrix.node_index }} \
            --max-process-number 16

  finalize:
    name: Finalize ${{ inputs.display_name }}
    needs: [prepare, parse]
    if: always() && needs.prepare.result == 'success'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    container:
      image: ${{ inputs.image }}
    steps:
      - name: Checkout profiling source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: profile-source

      - name: Publish parsed profile manifest
        working-directory: profile-source
        env:
          AWS_ACCESS_KEY_ID: ${{ github.repository_owner == 'vllm-project' && secrets.OBS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ github.repository_owner == 'vllm-project' && secrets.OBS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          PROFILE_KEY_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          python3 -c 'import boto3' 2>/dev/null || python3 -m pip install --quiet boto3
          python3 -m tools.profile finalize \
            --root /tmp/profile_finalize \
            --prefix "$PROFILE_KEY_PREFIX"
