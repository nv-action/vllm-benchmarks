name: Parse nightly profiling traces

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      prefix:
        required: true
        type: string
      display_name:
        required: true
        type: string
      ref:
        required: true
        type: string
      should_run:
        required: true
        type: boolean
    secrets:
      HW_OBS_PROFILE_AK:
        required: true
      HW_OBS_PROFILE_SK:
        required: true

defaults:
  run:
    shell: bash -el {0}

jobs:
  prepare:
    name: Plan ${{ inputs.display_name }}
    if: ${{ inputs.should_run }}
    runs-on: linux-arm64-cpu-16
    timeout-minutes: 30
    container:
      image: ${{ inputs.image }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - name: Checkout profiling tools
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: profile-source

      - name: Plan profile parser shards
        id: plan
        working-directory: profile-source
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HW_OBS_PROFILE_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HW_OBS_PROFILE_SK }}
          PROFILE_KEY_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet boto3
          python3 -m pip install --quiet esdk-obs-python || true
          echo "::group::OBS storage before parsed upload"
          python3 -m tools.profiling.storage status
          echo "::endgroup::"
          python3 -m tools.profiling.parse plan \
            --root /tmp/profile_plan \
            --prefix "$PROFILE_KEY_PREFIX" \
            --plan-output /tmp/profile_plan/matrix.json
          echo "matrix=$(cat /tmp/profile_plan/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "has_work=$(jq '.node_index | length > 0' /tmp/profile_plan/matrix.json)" >> "$GITHUB_OUTPUT"

  parse:
    name: ${{ inputs.display_name }} / node-${{ matrix.node_index }}
    needs: [prepare]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: linux-arm64-cpu-16
    timeout-minutes: 360
    container:
      image: ${{ inputs.image }}
    steps:
      - name: Checkout profiling tools
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: profile-source

      - name: Parse ranks with concurrent compression and upload
        working-directory: profile-source
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HW_OBS_PROFILE_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HW_OBS_PROFILE_SK }}
          PROFILE_KEY_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          echo '========== Profiling offline parse =========='
          echo "Node shard: ${{ matrix.node_index }}"
          echo "CPU cores: $(nproc)"
          free -h
          df -h /tmp
          python3 -m pip install --quiet boto3
          python3 -m tools.profiling.parse parse \
            --root /tmp/profile_parse/node-${{ matrix.node_index }} \
            --prefix "$PROFILE_KEY_PREFIX" \
            --node-index ${{ matrix.node_index }}

  finalize:
    name: Finalize ${{ inputs.display_name }}
    needs: [prepare, parse]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.has_work == 'true'
    runs-on: linux-arm64-cpu-16
    timeout-minutes: 30
    container:
      image: ${{ inputs.image }}
    steps:
      - name: Checkout profiling tools
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: profile-source

      - name: Publish parsed profile manifest
        working-directory: profile-source
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HW_OBS_PROFILE_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HW_OBS_PROFILE_SK }}
          PROFILE_KEY_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet boto3
          python3 -m tools.profiling.parse finalize \
            --root /tmp/profile_finalize \
            --prefix "$PROFILE_KEY_PREFIX"
