# TEMPORARY: reproduce the main2main format.sh stall on the a3-16 pool.
#
# The probe run showed the shared store lock is free, so the next question is
# what pre-commit actually blocks on.  This run executes the exact command the
# flow runs (bash format.sh ci with the shared PRE_COMMIT_HOME) against
# vllm-project/vllm-ascend main, unbuffered, under a 15 min cap, and prints
# the store state before and after.
#
# Dispatch (push-triggered only; the fork API cannot dispatch a workflow that
# is absent from the default branch):
#   any commit touching this file on wf/harness-parity
# Delete this file once the stall is explained.
name: 'temp: reproduce format.sh stall'

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/temp_repro_format_hang.yaml

defaults:
  run:
    shell: bash

jobs:
  repro:
    name: Run format.sh ci against vllm-ascend main (a3-16)
    runs-on: linux-aarch64-a3-16-sh-001
    timeout-minutes: 30
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12
      env:
        PRE_COMMIT_HOME: /root/.cache/main2main-pre-commit-a3-16-aarch64
        SKIP: gitleaks-offline-scan
        PYTHONUNBUFFERED: "1"
        GOPROXY: https://repo.huaweicloud.com/repository/goproxy/
        GONOSUMDB: '*'
    steps:
      - name: Store state before
        run: |
          set -u
          echo "host=$(hostname)"
          echo "pre-commit: $(command -v pre-commit || echo MISSING)"
          pre-commit --version 2>&1 || true
          echo "== store =="
          ls -la "$PRE_COMMIT_HOME" | head -30
          echo "== hook repos in the store =="
          for d in "$PRE_COMMIT_HOME"/repo*; do
            printf '%s\t%s\t%s\n' "$(basename "$d")" \
              "$(git -C "$d" remote get-url origin 2>/dev/null || echo '?')" \
              "$(git -C "$d" rev-parse --short HEAD 2>/dev/null || echo '?')"
          done
          echo "== pre-commit.log tail =="
          tail -40 "$PRE_COMMIT_HOME/pre-commit.log" 2>/dev/null || echo "(no log)"
      - name: Clone vllm-ascend main
        run: |
          set -ux
          echo "github reachability: $(curl -sS -m 10 -o /dev/null -w '%{http_code}' https://github.com 2>&1 || true)"
          rm -rf /tmp/ascend
          timeout 300 git clone --depth 1 https://github.com/vllm-project/vllm-ascend.git /tmp/ascend
          echo "CLONE_EXIT=$?"
          git -C /tmp/ascend log -1 --format='%H %ci %s'
          git config --global --add safe.directory /tmp/ascend
          grep -E '^\s*- repo:|rev:' /tmp/ascend/.pre-commit-config.yaml
      - name: Install pre-commit if the image lacks it
        run: |
          set -u
          if ! command -v pre-commit >/dev/null; then
            pip config set global.index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
            pip config set global.trusted-host cache-service.nginx-pypi-cache.svc.cluster.local
            pip install pre-commit==4.0.1
          fi
          pre-commit --version
      - name: Run format.sh ci (bounded to 15 min)
        run: |
          set -u
          cd /tmp/ascend
          start=$SECONDS
          timeout -k 10 900 bash format.sh ci
          rc=$?
          echo "FORMAT_EXIT=$rc elapsed=$((SECONDS - start))s"
          echo "== lock probe after =="
          python3 - "$PRE_COMMIT_HOME/.lock" <<'PY'
          import fcntl, os, sys
          p = sys.argv[1]
          if not os.path.exists(p):
              print("PROBE: no lock file")
              sys.exit(0)
          fd = os.open(p, os.O_RDWR | os.O_CREAT, 0o644)
          try:
              fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
              print("PROBE: LOCK FREE")
              fcntl.flock(fd, fcntl.LOCK_UN)
          except BlockingIOError:
              print("PROBE: LOCK HELD by another process")
          finally:
              os.close(fd)
          PY
          ps -ef 2>/dev/null | grep -E 'pre-commit|pre_commit|git clone' | grep -v grep || echo "(no leftover hook processes visible)"
      - name: Store state after
        if: always()
        run: |
          set -u
          ls -la "$PRE_COMMIT_HOME" | head -30
          du -sh "$PRE_COMMIT_HOME" 2>/dev/null || true
          tail -40 "$PRE_COMMIT_HOME/pre-commit.log" 2>/dev/null || echo "(no log)"
