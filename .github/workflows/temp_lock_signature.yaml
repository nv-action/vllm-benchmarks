# TEMPORARY: does a held pre-commit store lock reproduce the production
# signature (no output, db.db untouched, hang until killed)?
#
# Production evidence: /root/.cache/main2main-pre-commit-a3-16-aarch64/db.db
# was last written 2026-10-14 even though five runs hung at format.sh between
# 10-19 and 10-26.  A normal pre-commit run rewrites db.db within seconds.
# This experiment holds the store lock from a sibling process, runs the same
# pre-commit command under a 30 s cap, and shows whether it blocks before any
# output / any db write.
name: 'temp: pre-commit lock signature'

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/temp_lock_signature.yaml

defaults:
  run:
    shell: bash

jobs:
  signature:
    name: Held store lock vs pre-commit (a3-16)
    runs-on: linux-aarch64-a3-16-sh-001
    timeout-minutes: 15
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12
      env:
        PRE_COMMIT_HOME: /root/.cache/main2main-pre-commit-a3-16-aarch64
        SKIP: gitleaks-offline-scan
        PYTHONUNBUFFERED: "1"
        GOPROXY: https://repo.huaweicloud.com/repository/goproxy/
        GONOSUMDB: '*'
    steps:
      - name: Install pre-commit and clone vllm-ascend main
        run: |
          set -eux
          pip install -q pre-commit==4.0.1
          pre-commit --version
          rm -rf /tmp/ascend
          timeout 300 git clone --depth 1 https://github.com/vllm-project/vllm-ascend.git /tmp/ascend
          git config --global --add safe.directory /tmp/ascend
      - name: Show pre-commit's lock handling
        run: |
          set -u
          PC=$(python3 -c 'import pre_commit, os; print(os.path.dirname(pre_commit.__file__))')
          echo "pkg=$PC"
          echo "== lock call sites =="
          grep -rn "exclusive\|flock\|LOCK_EX" "$PC" | head -40
          echo "== file_lock.py =="
          cat "$PC/file_lock.py"
          echo "== store.py (head) =="
          sed -n '1,120p' "$PC/store.py"
      - name: Hold the lock and run pre-commit behind it
        run: |
          set -u
          STORE="$PRE_COMMIT_HOME"
          echo "db before: $(stat -c '%y' "$STORE/db.db" 2>/dev/null || echo missing)"
          python3 - <<'PY' &
          import fcntl, os, time
          p = os.environ['PRE_COMMIT_HOME'] + '/.lock'
          fd = os.open(p, os.O_RDWR | os.O_CREAT, 0o644)
          fcntl.flock(fd, fcntl.LOCK_EX)
          print("HOLDER: store lock held for 120s", flush=True)
          time.sleep(120)
          PY
          HOLDER=$!
          sleep 3
          cd /tmp/ascend
          start=$SECONDS
          timeout -k 5 30 pre-commit run --all-files --hook-stage manual
          rc=$?
          echo "PRECOMMIT_RC=$rc elapsed=$((SECONDS - start))s"
          echo "db after: $(stat -c '%y' "$STORE/db.db" 2>/dev/null || echo missing)"
          kill "$HOLDER" 2>/dev/null || true
          wait "$HOLDER" 2>/dev/null || true
          echo "== lock probe after holder exit =="
          python3 - "$STORE/.lock" <<'PY'
          import fcntl, os, sys
          fd = os.open(sys.argv[1], os.O_RDWR | os.O_CREAT, 0o644)
          try:
              fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
              print("PROBE: LOCK FREE")
          except BlockingIOError:
              print("PROBE: LOCK HELD")
          os.close(fd)
          PY
      - name: Control run without the holder
        run: |
          set -u
          STORE="$PRE_COMMIT_HOME"
          cd /tmp/ascend
          start=$SECONDS
          timeout -k 5 120 pre-commit run --all-files --hook-stage manual
          echo "CONTROL_RC=$? elapsed=$((SECONDS - start))s"
          echo "db after control: $(stat -c '%y' "$STORE/db.db" 2>/dev/null || echo missing)"
