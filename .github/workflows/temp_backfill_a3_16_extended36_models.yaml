# TEMPORARY: backfill the a3-16 model cache (shared NFS, /root/.cache) used
# by the main2main / gate e2e on linux-aarch64-a3-16-sh-001.
#
# Round 2, 2026-10-13: main2main run 38220121641 (tree cc59a7d7) lost most of
# the round-1 e2e to offline-cache misses — modelscope "Cannot find the
# requested files in the cached path and outgoing traffic has been disabled".
# Repo ids pinned from the per-case traceback repo_id= lines:
#
#   CONFIRMED misses (traceback names the repo):
#     openai-mirror/whisper-large-v3-turbo   test_vlm.py::test_whisper (1.6GB)
#     Qwen/Qwen2-Audio-7B-Instruct           test_vlm.py::test_multimodal_audio (16.8GB)
#     vllm-ascend/Qwen3-8B-W8A8              test_qwen3_8b_w8a8.py::test_dense_w8a8_eagle3_full_graph (11.3GB)
#     vllm-ascend/DeepSeek-V2-Lite-W8A8      model_runner_v2/test_deepseek_v2_lite_w8a8_basic.py eager+graph (17.2GB)
#     deepseek-ai/DeepSeek-V2-Lite-Chat      test_prefix_caching.py tp2 case (31.4GB)
#
#   From the round-1 suite roster (suite blocked on a model it loads):
#     Qwen/Qwen3-0.6B                        7 small suites (sampler, cpu
#                                            offload x2, multi_instance, uva,
#                                            model_runner_v2/test_basic, pause_resume) (1.5GB)
#     vllm-ascend/DeepSeek-V3-Pruning        test_deepseek_multistream_moe.py (27.9GB)
#     vllm-ascend/DeepSeek-V3.2-W8A8-Pruning four_card/test_deepseek_v3_2_w8a8_pruning.py (22.9GB)
#     UploadWeight/DeepSeek-V4-Flash-DSpark-w4a8-test
#                                            model_runner_v2/test_deepseek_v4.py
#                                            dspark 4-card — 169.8GB, downloaded
#                                            LAST so a timeout loses the least
#                                            (re-dispatch resumes idempotently)
#     Qwen/Qwen2.5-VL-7B-Instruct            test_disaggregated_encoder.py — never
#                                            reached in the run; insurance (16.6GB)
#
#   Extended-36 gate set (same cache):
#     vllm-ascend/DeepSeek-V2-Lite-W8A8      (confirmed above)
#     wemaster/deepseek_mtp_main_random_bf16 (12.0GB)
#     LLM-Research/Meta-Llama-3.1-8B-Instruct (32.1GB)
#     vllm-ascend/EAGLE-LLaMA3.1-Instruct-8B (1.6GB)
#
#   Excluded on purpose (upstream skips, not model misses):
#     Qwen/Qwen3-30B-A3B    test_data_parallel_tp2.py is
#                           @pytest.mark.skip(reason="broken, fix me") — the case
#                           never started; 60GB not needed.
#     vllm-ascend/HunyuanOCR  test_multimodal_vl[hunyuan-vl] skips: "HunyuanVL is
#                           not supported by the pinned vLLM versions".
#
# Round 1 (2026-09-16, run 35047990352) covered the 36-case extended set:
# OLMoE, olmoe-lora adapter, Qwen2.5-1.5B-apeach, dspark_qwen3_8b_block7,
# Qwen3.5-0.8B, DeepSeek-V2 + DeepSeek-V3.2-Exp (config-only), charent
# adapters (HF), RedHatAI eagle3 (HF, optional then).
#
# Same mechanics: cann container, modelscope<1.38 in an isolated venv, dots
# in repo names stored as triple underscores.  HF downloads try
# huggingface.co then hf-mirror.com.  Re-dispatching is idempotent —
# modelscope/HF skip files already fully cached.  Delete this file once all
# repos are confirmed offline-readable.
name: 'temp: backfill a3-16 cache (36-case extended set)'

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash -el {0}

env:
  # modelscope, FULL weights — smallest first, DSpark last (see header)
  MS_MODELS_FULL: |
    openai-mirror/whisper-large-v3-turbo
    Qwen/Qwen3-0.6B
    RedHatAI/Qwen3-8B-speculator.eagle3
    vllm-ascend/EAGLE-LLaMA3.1-Instruct-8B
    vllm-ascend/Qwen3-8B-W8A8
    wemaster/deepseek_mtp_main_random_bf16
    Qwen/Qwen2.5-VL-7B-Instruct
    Qwen/Qwen2-Audio-7B-Instruct
    vllm-ascend/DeepSeek-V2-Lite-W8A8
    vllm-ascend/DeepSeek-V3.2-W8A8-Pruning
    vllm-ascend/DeepSeek-V3-Pruning
    deepseek-ai/DeepSeek-V2-Lite-Chat
    LLM-Research/Meta-Llama-3.1-8B-Instruct
    UploadWeight/DeepSeek-V4-Flash-DSpark-w4a8-test
  # HF hub (test patches VLLM_USE_MODELSCOPE=False for the eagle3
  # speculator, so the engine reads it from the HF cache)
  HF_MODELS_REQUIRED: |
    RedHatAI/Qwen3-8B-speculator.eagle3

jobs:
  backfill:
    name: Download models on a3-16
    runs-on: linux-aarch64-a3-16-sh-001
    timeout-minutes: 360
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12
    steps:
      - name: Pre-check cache state (fs + node fingerprint)
        env:
          MS_FULL: ${{ env.MS_MODELS_FULL }}
        run: |
          echo "runner=$(hostname)"
          echo "fs-of-cache: $(df -T /root/.cache 2>/dev/null | tail -1)"
          du -sh /root/.cache/modelscope 2>/dev/null || echo "(no modelscope cache yet)"
          du -sh /root/.cache/huggingface 2>/dev/null || echo "(no HF cache yet)"
          for m in $MS_FULL; do
            d="/root/.cache/modelscope/hub/models/${m}"
            if [ -d "$d" ]; then du -sh "$d"; else echo "MISSING $d"; fi
          done
          for m in $HF_MODELS_REQUIRED; do
            [ -z "$m" ] && continue
            d="/root/.cache/huggingface/hub/models--${m%%/*}--${m##*/}"
            if [ -d "$d" ]; then du -sh "$d"; else echo "MISSING $d"; fi
          done

      - name: Install modelscope<1.38 + huggingface_hub in an isolated venv
        run: |
          set -euxo pipefail
          python3 -m venv /tmp/msdl_venv
          /tmp/msdl_venv/bin/pip install -q \
            -i https://repo.huaweicloud.com/repository/pypi/simple \
            "modelscope<1.38" "huggingface_hub"
          /tmp/msdl_venv/bin/python -c \
            "import modelscope, huggingface_hub; \
             print('modelscope', modelscope.__version__, \
                   '| hf_hub', huggingface_hub.__version__)"

      - name: Download modelscope models (full weights)
        env:
          MS_FULL: ${{ env.MS_MODELS_FULL }}
        run: |
          set -euo pipefail
          failed=""
          while read -r model; do
            [ -z "$model" ] && continue
            echo "▶ Downloading model $model (full)"
            t0=$SECONDS
            if ! /tmp/msdl_venv/bin/modelscope download "$model"; then
              failed="$failed $model"
            fi
            echo "[took $((SECONDS - t0))s] $model"
          done <<< "$MS_FULL"
          if [ -n "$failed" ]; then echo "download failed:$failed"; exit 1; fi

      - name: Download HF-hub models (huggingface.co, then hf-mirror.com)
        env:
          HF_REQ: ${{ env.HF_MODELS_REQUIRED }}
        run: |
          set -uo pipefail
          failed=""
          while IFS=: read -r model required; do
            [ -z "$model" ] && continue
            echo "▶ Downloading HF model $model (required=${required})"
            t0=$SECONDS
            ok=""
            # an EMPTY HF_ENDPOINT string breaks huggingface_hub (it would
            # build relative URLs) — always pass a full endpoint URL
            for endpoint in "https://huggingface.co" "https://hf-mirror.com"; do
              echo "  endpoint: $endpoint"
              if HF_ENDPOINT="$endpoint" \
                 /tmp/msdl_venv/bin/python -c \
                 "from huggingface_hub import snapshot_download; \
                  import sys; \
                  p = snapshot_download(sys.argv[1]); print('->', p)" \
                 "$model"; then
                ok=1
                break
              fi
              echo "  endpoint failed, trying next"
            done
            if [ -z "$ok" ]; then
              if [ "$required" = "required" ]; then
                failed="$failed $model"
              else
                echo "⚠ optional repo $model failed on every endpoint (non-fatal)"
              fi
            fi
            echo "[took $((SECONDS - t0))s] $model"
          done <<EOF
          $(while read -r m; do [ -z "$m" ] || echo "$m:required"; done <<< "$HF_REQ")
          EOF
          if [ -n "$failed" ]; then echo "download failed:$failed"; exit 1; fi

      - name: Reproduce the e2e offline read (no network)
        env:
          MS_FULL: ${{ env.MS_MODELS_FULL }}
        run: |
          set -uxo pipefail
          # the e2e installs modelscope<1.38 via requirements-dev.txt
          # (resolved 1.37.1 in run 34084313012) — the isolated venv above
          # carries the same family, so its offline scan is faithful
          HF_HUB_OFFLINE=1 /tmp/msdl_venv/bin/python - <<'PY'
          import os
          import traceback
          from modelscope import snapshot_download
          from huggingface_hub import snapshot_download as hf_snapshot
          ms_models = [m for m in os.environ.get("MS_FULL", "").split() if m]
          hf_models = [m for m in os.environ.get("HF_MODELS_REQUIRED", "").split()
                       if m]
          for m in ms_models:
              try:
                  p = snapshot_download(m, local_files_only=True)
                  print(f"[OFFLINE-OK modelscope] {m} -> {p}", flush=True)
              except Exception as e:
                  print(f"[OFFLINE-FAIL modelscope] {m}: "
                        f"{type(e).__name__}: {e}", flush=True)
                  traceback.print_exc()
          for m in hf_models:
              try:
                  p = hf_snapshot(m, local_files_only=True)
                  print(f"[OFFLINE-OK hf] {m} -> {p}", flush=True)
              except Exception as e:
                  print(f"[OFFLINE-FAIL hf] {m}: {type(e).__name__}: {e}",
                        flush=True)
                  traceback.print_exc()
          PY

      - name: Verify cache layout
        if: always()
        run: |
          du -sh /root/.cache/modelscope /root/.cache/huggingface 2>/dev/null
          find /root/.cache/modelscope/hub/models -maxdepth 2 \
            \( -iname "*whisper*" -o -iname "*Qwen3-0___6B*" \
               -o -iname "*speculator.eagle3*" -o -iname "*EAGLE-LLaMA3.1*" \
               -o -iname "*Qwen3-8B-W8A8*" -o -iname "*deepseek_mtp*" \
               -o -iname "*Qwen2___5-VL-7B*" -o -iname "*Qwen2-Audio*" \
               -o -iname "*DeepSeek-V2-Lite*" -o -iname "*DeepSeek-V3___2-W8A8*" \
               -o -iname "*DeepSeek-V3-Pruning*" -o -iname "*Meta-Llama-3.1*" \
               -o -iname "*DSpark*" \) | sort
          ls /root/.cache/huggingface/hub/ 2>/dev/null | grep -i "RedHatAI" || true
