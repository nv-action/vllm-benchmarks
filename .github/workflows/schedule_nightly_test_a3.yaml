name: Nightly-A3
run-name: A3 cleanup validation - ${{ inputs.mode }} - skip-local=${{ inputs.skip_local_cleanup }} - source=${{ inputs.source_run_id }}

# Reuse an already registered dispatch path; no default-branch changes are needed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Launch a real two-node workload or manually clean up a completed validation run
        type: choice
        options: [launch, cleanup]
        default: launch
      skip_local_cleanup:
        description: Simulate a missing local cleanup step (validation only)
        type: boolean
        default: false
      source_run_id:
        description: Completed workload run to clean up (required for cleanup)
        type: string
        default: ''
      source_attempt:
        description: Exact workload attempt to clean up
        type: string
        default: '1'
      dry_run:
        description: Only report eligible resources during cleanup
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: a3-cleanup-validation-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  launch:
    if: ${{ !cancelled() && inputs.mode == 'launch' && github.ref == 'refs/heads/test/a3-lws-cleanup-validation' }}
    uses: ./.github/workflows/_e2e_nightly_multi_node.yaml
    with:
      soc_version: a3
      runner: linux-aarch64-a3-800t-0
      image: swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:nightly-ci-main-a3
      replicas: '1'
      size: '2'
      config_file_path: GLM5_1-W8A8-A3-dual-nodes.yaml
      config_base_path: tests/e2e/cases/models/configs/GLM
      vllm_ascend_branch: main
      ascend_log_prefix: /root/.cache/cleanup-validation/logs
      name: a3-cleanup-validation
      testcase_timeout: '20'
      should_run: true
      cleanup_validation: true
      skip_local_cleanup: ${{ inputs.skip_local_cleanup }}
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

  cleanup:
    if: ${{ !cancelled() && inputs.mode == 'cleanup' && github.ref == 'refs/heads/test/a3-lws-cleanup-validation' }}
    runs-on: linux-aarch64-a3-800t-0
    timeout-minutes: 10
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:nightly-cpu
      env:
        KUBECONFIG: /tmp/lws-validation-kubeconfig
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout validation implementation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check validation tools
        run: |
          python3 -c "import yaml" || python3 -m pip install -r .github/workflows/scripts/requirements-lws-cleanup.txt
          python3 .github/workflows/scripts/lws_cleanup_validation.py --help > /dev/null

      - name: Decode kubeconfig and check tools
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          umask 077
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$KUBECONFIG"
          python3 .github/workflows/scripts/lws_cleanup_validation.py --help
          kubectl version --client
      - name: Clean up only the selected validation run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 .github/workflows/scripts/lws_cleanup_validation.py cleanup \
            --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
            "${args[@]}"
      - name: Remove temporary kubeconfig
        if: ${{ always() }}
        run: rm -f "$KUBECONFIG"
