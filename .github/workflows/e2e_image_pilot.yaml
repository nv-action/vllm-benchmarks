name: E2E Image Pilot

on:
  push:
    branches: [codex/e2e-image-pilot]
    paths:
      - .github/workflows/e2e_image_pilot.yaml
      - .github/workflows/_e2e_image_build_and_test.yaml
      - .github/workflows/dockerfiles/Dockerfile.e2e
      - .github/workflows/scripts/*e2e*
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'vllm-ascend branch, tag or commit to build and test'
        type: string
        default: main
      csrc_cache:
        description: 'Restore L0/L1 before building; false compiles from source on a Docker layer miss'
        type: boolean
        default: true
      refresh_layers:
        description: 'Refresh all Docker layers (csrc cache setting remains independent)'
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-image-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    # The new timer is opt-in until its SWR repo and secrets are ready.
    if: github.event_name != 'schedule' || vars.E2E_IMAGE_PILOT_ENABLED == 'true'
    runs-on: linux-amd64-cpu-8-hk
    container:
      image: quay.io/ascend-ci/vllm-ascend:lint
    outputs:
      source_ref: ${{ steps.refs.outputs.source_ref }}
      main_commit: ${{ steps.refs.outputs.main_commit }}
      release_tag: ${{ steps.refs.outputs.release_tag }}
      image_matrix: ${{ steps.plan.outputs.image_matrix }}
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Stage workflow helpers
        shell: bash
        run: bash .github/workflows/scripts/stage_ci_actions.sh

      - name: Checkout tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Pin source and vLLM refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          main_commit=$(tr -d '[:space:]' < .github/vllm-main-verified.commit)
          release_tag=$(tr -d '[:space:]' < .github/vllm-release-tag.commit)
          {
            echo "source_ref=$(git rev-parse HEAD)"
            echo "main_commit=$main_commit"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Collect the complete E2E suite and hardware partitions
        id: selection
        shell: bash
        run: |
          pip install regex pyyaml
          # Reuse test definitions/routing, not PR recommendation or workflows.
          python3 .github/workflows/scripts/select_tests.py --all-tests --skip-cpu-ut

      - name: Plan A2 and A3 image builds
        id: plan
        shell: bash
        env:
          GROUPS_JSON: ${{ steps.selection.outputs.test_groups }}
        run: |
          python3 "$RUNNER_TEMP/ci-workflow/.github/workflows/scripts/e2e_image.py" \
            --groups "$GROUPS_JSON"

  images:
    name: Image pilot (${{ matrix.device.target.device }}-${{ matrix.version.lane }})
    needs: prepare
    if: needs.prepare.outputs.image_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.prepare.outputs.image_matrix) }}
        version:
          - lane: main
            ref: ${{ needs.prepare.outputs.main_commit }}
          - lane: release
            ref: ${{ needs.prepare.outputs.release_tag }}
    uses: ./.github/workflows/_e2e_image_build_and_test.yaml
    secrets:
      SWR_E2E_USERNAME: ${{ secrets.SWR_E2E_USERNAME }}
      SWR_E2E_PASSWORD: ${{ secrets.SWR_E2E_PASSWORD }}
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      vllm: ${{ matrix.version.ref }}
      lane: ${{ matrix.version.lane }}
      target: ${{ toJSON(matrix.device.target) }}
      test_groups: ${{ toJSON(matrix.device.groups) }}
      refresh_layers: ${{ inputs.refresh_layers || false }}
      use_csrc_cache: ${{ github.event_name != 'workflow_dispatch' || inputs.csrc_cache }}

  report:
    needs: [prepare, images]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report pipeline timing
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const request = { ...context.repo, run_id: context.runId };
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...request, filter: 'latest', per_page: 100,
            });
            const { data: run } = await github.rest.actions.getWorkflowRun(request);
            const seconds = (start, end) => start && end
              ? Math.max(0, (Date.parse(end) - Date.parse(start)) / 1000) : null;
            const completed = jobs.filter(job => job.completed_at);
            const end = completed.map(job => job.completed_at).sort().at(-1);
            const report = {
              run_id: context.runId, attempt: run.run_attempt,
              attempt_started_at: run.run_started_at || run.created_at,
              elapsed_seconds: seconds(run.run_started_at || run.created_at, end),
              jobs: jobs.map(job => ({
                name: job.name, conclusion: job.conclusion,
                elapsed_seconds: seconds(job.started_at, job.completed_at),
                steps: (job.steps || []).map(step => ({
                  name: step.name, conclusion: step.conclusion,
                  elapsed_seconds: seconds(step.started_at, step.completed_at),
                })),
              })),
            };
            fs.writeFileSync('e2e-image-timing.json', JSON.stringify(report, null, 2));
            await core.summary.addHeading('A2/A3 E2E image pilot')
              .addRaw(`Elapsed from attempt start to the last completed job: ${report.elapsed_seconds ?? 'unavailable'} s\n\n`)
              .addRaw('Includes queueing, image/cache preparation, push, container startup and tests. Parallel durations must not be summed.\n\n')
              .addTable([
                [{ data: 'Job / step', header: true }, { data: 'Result', header: true }, { data: 'Seconds', header: true }],
                ...report.jobs.filter(job => job.name.includes('Image pilot (')).flatMap(job => [
                  [job.name, job.conclusion ?? 'running', String(job.elapsed_seconds ?? '')],
                  ...job.steps.filter(step => /Initialize containers|cache|Build and push|Prepare image|Run complete/.test(step.name))
                    .map(step => [step.name, step.conclusion ?? 'running', String(step.elapsed_seconds ?? '')]),
                ]),
              ]).write();

      - name: Upload pipeline timing
        uses: actions/upload-artifact@v7
        with:
          name: e2e-image-timing
          path: e2e-image-timing.json
          retention-days: 14
