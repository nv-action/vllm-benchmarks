name: Test CI images

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to build and overwrite on Quay
        type: choice
        required: true
        default: both
        options:
          - both
          - lint-main
          - lite-tools
      delete_legacy_ci:
        description: Delete the old ci tag after lite-tools passes verification
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: quay.io/atlas-ci/vllm-ascend-ci

jobs:
  lint:
    name: Build lint-main (amd64)
    concurrency:
      group: test-image-lint-main
      cancel-in-progress: false
    if: inputs.image == 'both' || inputs.image == 'lint-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ASCEND_CI_US }}
          password: ${{ secrets.QUAY_ASCEND_CI_PW }}

      - name: Check target repository push permission
        env:
          QUAY_USER: ${{ vars.QUAY_ASCEND_CI_US }}
          QUAY_PASSWORD: ${{ secrets.QUAY_ASCEND_CI_PW }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["IMAGE_REPOSITORY"].removeprefix("quay.io/")
          query = urllib.parse.urlencode({"service": "quay.io", "scope": f"repository:{repository}:pull,push"})
          credentials = (os.environ["QUAY_USER"] + ":" + os.environ["QUAY_PASSWORD"]).encode()
          request = urllib.request.Request(
              "https://quay.io/v2/auth?" + query,
              headers={"Authorization": "Basic " + base64.b64encode(credentials).decode()},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["token"]
          upload_request = urllib.request.Request(
              f"https://quay.io/v2/{repository}/blobs/uploads/",
              data=b"",
              method="POST",
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/octet-stream"},
          )
          try:
              with urllib.request.urlopen(upload_request, timeout=30) as response:
                  if response.status != 202:
                      raise SystemExit(f"::error::Unexpected registry upload status: {response.status}")
                  location = urllib.parse.urljoin("https://quay.io", response.headers["Location"])
          except urllib.error.HTTPError as error:
              raise SystemExit(
                  f"::error::Registry upload permission check failed for {repository}: HTTP {error.code}"
              ) from None
          parsed = urllib.parse.urlparse(location)
          if parsed.scheme != "https" or parsed.netloc != "quay.io":
              raise SystemExit("::error::Unexpected registry upload location")
          cancel_request = urllib.request.Request(
              location, method="DELETE", headers={"Authorization": "Bearer " + token},
          )
          with urllib.request.urlopen(cancel_request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f"::error::Unexpected upload cleanup status: {response.status}")
          print(f"Push permission confirmed by registry upload API: {repository}")
          print("Empty upload session cancelled; no image or tag was created.")
          PYTHON

      - name: Make room for lint dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Read verified vLLM commit
        id: vllm
        run: |
          commit="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          [[ "$commit" =~ ^[0-9a-f]{7,40}$ ]] || { echo '::error::Invalid vLLM commit'; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Build and push lint-main
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/workflows/dockerfiles/Dockerfile.lint
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPOSITORY }}:lint-main
          push: true
          provenance: false
          build-args: |
            VLLM_COMMIT=${{ steps.vllm.outputs.commit }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Verify uploaded lint image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="${IMAGE_REPOSITORY}@${DIGEST}"
          docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = amd64
          docker run --rm --network none --platform linux/amd64 "$image" bash -euo pipefail -c '
            pre-commit --version
            mypy --version
            python3 -c "import yaml, regex; from importlib.metadata import version; print({name: version(name) for name in (\"torch\", \"torch-npu\", \"transformers\", \"pre-commit\", \"mypy\")})"
          '
          {
            echo "Image: ${IMAGE_REPOSITORY}:lint-main"
            echo "Digest: ${DIGEST}"
            echo "Source: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: Build lite-tools (amd64, arm64)
    concurrency:
      group: test-image-ci
      cancel-in-progress: false
    if: inputs.image == 'both' || inputs.image == 'lite-tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ASCEND_CI_US }}
          password: ${{ secrets.QUAY_ASCEND_CI_PW }}

      - name: Check target repository push permission
        env:
          QUAY_USER: ${{ vars.QUAY_ASCEND_CI_US }}
          QUAY_PASSWORD: ${{ secrets.QUAY_ASCEND_CI_PW }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["IMAGE_REPOSITORY"].removeprefix("quay.io/")
          query = urllib.parse.urlencode({"service": "quay.io", "scope": f"repository:{repository}:pull,push"})
          credentials = (os.environ["QUAY_USER"] + ":" + os.environ["QUAY_PASSWORD"]).encode()
          request = urllib.request.Request(
              "https://quay.io/v2/auth?" + query,
              headers={"Authorization": "Basic " + base64.b64encode(credentials).decode()},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["token"]
          upload_request = urllib.request.Request(
              f"https://quay.io/v2/{repository}/blobs/uploads/",
              data=b"",
              method="POST",
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/octet-stream"},
          )
          try:
              with urllib.request.urlopen(upload_request, timeout=30) as response:
                  if response.status != 202:
                      raise SystemExit(f"::error::Unexpected registry upload status: {response.status}")
                  location = urllib.parse.urljoin("https://quay.io", response.headers["Location"])
          except urllib.error.HTTPError as error:
              raise SystemExit(
                  f"::error::Registry upload permission check failed for {repository}: HTTP {error.code}"
              ) from None
          parsed = urllib.parse.urlparse(location)
          if parsed.scheme != "https" or parsed.netloc != "quay.io":
              raise SystemExit("::error::Unexpected registry upload location")
          cancel_request = urllib.request.Request(
              location, method="DELETE", headers={"Authorization": "Bearer " + token},
          )
          with urllib.request.urlopen(cancel_request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f"::error::Unexpected upload cleanup status: {response.status}")
          print(f"Push permission confirmed by registry upload API: {repository}")
          print("Empty upload session cancelled; no image or tag was created.")
          PYTHON

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Build and push lite-tools
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/workflows/dockerfiles/dockerfile.tools
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REPOSITORY }}:lite-tools
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Verify uploaded CI images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="${IMAGE_REPOSITORY}@${DIGEST}"
          manifest="$(docker buildx imagetools inspect "$image" --raw)"
          jq -e '
            [.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]
          ' <<< "$manifest"
          for arch in amd64 arm64; do
            # The classic Docker image store cannot keep both architectures under one index digest.
            arch_digest="$(jq -er --arg arch "$arch" '
              .manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest
            ' <<< "$manifest")"
            docker run --rm --network none --platform "linux/${arch}" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
              "${IMAGE_REPOSITORY}@${arch_digest}" bash -euo pipefail -c '
                git config --global --add safe.directory /workspace
                git ls-files -s -- csrc setup.py CMakeLists.txt cmake > /tmp/csrc-manifest
                tar --zstd -cf /tmp/cache.tar.zst -C /tmp csrc-manifest
                mkdir /tmp/restored
                tar --zstd -xf /tmp/cache.tar.zst -C /tmp/restored
                cmp /tmp/csrc-manifest /tmp/restored/csrc-manifest
                export GITHUB_OUTPUT=/tmp/job-output
                python3 .github/workflows/scripts/resolve_csrc_cache_targets.py --all
                python3 .github/workflows/scripts/coverage.py
                python3 .github/workflows/scripts/select_tests.py --all-tests
                python3 .github/workflows/scripts/select_tests.py --all-tests --skip-cpu-ut --skip-a5
                python3 .github/workflows/scripts/select_tests.py \
                  --curated a5 --runner-label-override linux-aarch64-a5-4
                python3 .github/workflows/scripts/resolve_daily_tests.py \
                  --daily-config .github/workflows/configs/daily_config.yaml \
                  --nightly-config .github/workflows/configs/nightly_config.yaml
                python3 tests/e2e/doctests/scripts/doctest_helper.py plan \
                  --quickstart-devices a2,310p --installation-methods pip,uv,source \
                  --quickstart-image-repository example.invalid/vllm-ascend \
                  --installation-image-repository example.invalid/cann > /tmp/doctest-plan.json
                jq -e ".run_quickstart and .run_installation" /tmp/doctest-plan.json
              '
          done
          {
            echo "Image: ${IMAGE_REPOSITORY}:lite-tools"
            echo "Digest: ${DIGEST}"
            echo "Source: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retire the legacy ci tag
        if: inputs.delete_legacy_ci
        env:
          QUAY_USER: ${{ vars.QUAY_ASCEND_CI_US }}
          QUAY_PASSWORD: ${{ secrets.QUAY_ASCEND_CI_PW }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["IMAGE_REPOSITORY"].removeprefix("quay.io/")
          if repository != "atlas-ci/vllm-ascend-ci":
              raise SystemExit("::error::Unexpected repository for legacy tag cleanup")
          query = urllib.parse.urlencode({"service": "quay.io", "scope": f"repository:{repository}:pull,push"})
          credentials = (os.environ["QUAY_USER"] + ":" + os.environ["QUAY_PASSWORD"]).encode()
          request = urllib.request.Request(
              "https://quay.io/v2/auth?" + query,
              headers={"Authorization": "Basic " + base64.b64encode(credentials).decode()},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["token"]
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": ", ".join([
                  "application/vnd.oci.image.index.v1+json",
                  "application/vnd.docker.distribution.manifest.list.v2+json",
                  "application/vnd.oci.image.manifest.v1+json",
                  "application/vnd.docker.distribution.manifest.v2+json",
              ]),
          }

          def digest(tag):
              request = urllib.request.Request(
                  f"https://quay.io/v2/{repository}/manifests/{tag}", headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.headers["Docker-Content-Digest"]
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise SystemExit(f"::error::Cannot inspect {tag}: HTTP {error.code}") from None

          expected = os.environ["EXPECTED_DIGEST"]
          if not expected or digest("lite-tools") != expected:
              raise SystemExit("::error::lite-tools no longer matches the verified build")
          lint_digest = digest("lint-main")
          if not lint_digest:
              raise SystemExit("::error::Cannot verify lint-main before cleanup")
          old_digest = digest("ci")
          if old_digest is not None:
              if old_digest != "sha256:2cf966738deeab7df76c6e1b30edad8b13611ea4e25f72a3411e16601b923320":
                  raise SystemExit("::error::The ci tag changed; refusing to delete a different image")
              request = urllib.request.Request(
                  f"https://quay.io/v2/{repository}/manifests/ci", method="DELETE", headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 202:
                      raise SystemExit(f"::error::Unexpected delete status: {response.status}")
          if digest("ci") is not None or digest("lite-tools") != expected or digest("lint-main") != lint_digest:
              raise SystemExit("::error::Unexpected registry state after legacy tag cleanup")
          print("Legacy ci tag is absent; lite-tools and lint-main are unchanged.")
          PYTHON
