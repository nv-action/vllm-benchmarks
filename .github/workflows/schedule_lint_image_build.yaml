name: 'Image build lint'
on:
  #schedule:
    # Runs at 00:00 UTC+8 every day
    #  - cron: '0 20 * * *' 
  workflow_dispatch:
  push:
    paths:
      - '.github/vllm-main-verified.commit'
      - '.github/workflows/dockerfiles/Dockerfile.lint'
      - 'requirements-lint.txt'
      - 'requirements-dev.txt'
      - 'requirements.txt'

# only cancel in-progress runs of the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: vllm-ascend lint image build
    # TEMPORARY (coverage test branch): the lint image build/push is disabled.
    # The quay.io push fails on this fork (the login step is owner-gated to
    # vllm-project while push: true still runs unauthenticated), so the whole
    # job no-ops and succeeds. Restore the original steps to re-enable the
    # lint image build.
    runs-on: ubuntu-latest
    steps:
      - name: No-op (lint image build disabled on this branch)
        run: 'echo "vllm-ascend lint image build is disabled: nothing to run"'
