# Composes the runtime image build and the matching nightly test image build into
# a single reusable pipeline for one (chip, OS) pair:
#   build-base (uses _schedule_image_build.yaml) -> build-nightly (uses _nightly_image_build.yaml)
# Callers invoke this once per (chip, OS) so a slow base image only blocks its own
# nightly image; there is no global "wait for every base image" barrier.
#
# All dependency versions come from the root Dockerfiles, so this workflow only
# selects the target and the source branch.
name: 'Nightly image build with base'

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: "Nightly target / chip: 'a2', 'a3', '310p' or 'a5'"
      os:
        required: true
        type: string
        description: "Operating system variant to build: 'ubuntu' or 'openeuler'"
      soc:
        required: true
        type: string
        description: "Ascend SoC type (e.g. 910b, a3, 310p, 950)"
      dockerfile:
        required: true
        type: string
        description: "Base image Dockerfile (e.g. Dockerfile, Dockerfile.a3, Dockerfile.openEuler)"
      suffix:
        required: true
        type: string
        description: "Base image tag suffix (e.g. '', 'a3', 'openeuler', 'a3-openeuler')"
      vllm_ascend_branch:
        required: false
        type: string
        default: 'main'
        description: "Branch/ref to checkout"
      base_image_branch:
        required: false
        type: string
        default: ''
        description: "Branch used to resolve the base image tag. Defaults to vllm_ascend_branch."
      build_type:
        required: false
        type: string
        default: 'full'
        description: "Matrix shape for the nightly test image: 'full' builds both architectures and both OS variants; 'release' builds arm64 only. Dependency versions always come from the Dockerfiles. Callers of this chain leave it at the default, which keeps the standard nightly artifacts unchanged."
      should_push:
        required: false
        type: boolean
        default: false
        description: "If true, login to SWR and push built images."
      skip_base:
        required: false
        type: boolean
        default: false
        description: "If true, skip the base image build and only build the nightly image (base image must already exist)."
      swr_registry:
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com'
        description: 'SWR registry domain'
      swr_base_repo:
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com/ascend/vllm-ascend'
        description: "SWR repository for the runtime base image built from the root Dockerfiles. Overrides the downstream default so the whole pipeline can be pointed at a different region."
      swr_temp_repo:
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com/atlas_ci/vllm-atlas-temp'
        description: 'SWR repository for single-arch temp images and the build cache. Overrides the downstream default so the whole pipeline can be pointed at a different region.'
      nightly_release_repo:
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com/atlas_inference/vllm-ascend'
        description: "SWR repository for the release-shaped nightly images (openEuler variants, and the north-4 mirror). Overrides the downstream default so the whole pipeline can be pointed at a different region."
      cann_swr_url:
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann'
        description: "SWR registry/repository for the CANN CI job container image. Overrides the downstream default so the whole pipeline can be pointed at a different region."
      isolated_build:
        required: false
        type: boolean
        default: false
        description: "If true, build an isolated (/presmoke) pair instead of the standard nightly one. Both layers are derived from this single flag: they are published to the '-presmoke' repositories with the standard tags unchanged, never pushed to atlas_inference and never synced to quay.io. Default false keeps the standard repositories and tags."
      PR_ref:
        required: false
        type: string
        default: ''
        description: "Optional git ref the whole source tree is built from (e.g. refs/pull/<n>/head). /presmoke passes the triggering PR so both layers are built from the code and Dockerfiles under review ('pre-merge'), while vllm_ascend_branch still decides the branch and the published tag. Default '' builds vllm_ascend_branch."
    secrets:
      SWR_USERNAME:
        required: false
      SWR_PASSWORD:
        required: false
      SYNC_TOOLS_TOKEN:
        required: false

jobs:
  build-base:
    name: Build base image (${{ inputs.suffix || 'a2' }}-${{ inputs.os }})
    if: ${{ !inputs.skip_base && github.repository == 'nv-action/vllm-benchmarks' }}
    uses: ./.github/workflows/_schedule_image_build.yaml
    with:
      dockerfile: ${{ inputs.dockerfile }}
      suffix: ${{ inputs.suffix }}
      soc: ${{ inputs.soc }}
      should_push: ${{ inputs.should_push }}
      schedule_tag_pattern: 'main'
      branch_ref: ${{ inputs.vllm_ascend_branch || 'main' }}
      PR_ref: ${{ inputs.PR_ref }}
      swr_registry: ${{ inputs.swr_registry }}
      # An isolated build publishes the runtime image to its own '-presmoke' repo
      # while keeping the standard tag.
      swr_repo: ${{ inputs.swr_base_repo }}${{ inputs.isolated_build && '-presmoke' || '' }}
      swr_temp_repo: ${{ inputs.swr_temp_repo }}
      cann_swr_url: ${{ inputs.cann_swr_url }}
      isolated_build: ${{ inputs.isolated_build }}
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
      SYNC_TOOLS_TOKEN: ${{ secrets.SYNC_TOOLS_TOKEN }}

  build-nightly:
    name: Build nightly-${{ inputs.target }} (${{ inputs.os }})
    needs: build-base
    if: ${{ always() && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') }}
    uses: ./.github/workflows/_nightly_image_build.yaml
    with:
      target: ${{ inputs.target }}
      os_filter: ${{ inputs.os }}
      vllm_ascend_branch: ${{ inputs.vllm_ascend_branch }}
      base_image_branch: ${{ inputs.base_image_branch || inputs.vllm_ascend_branch }}
      build_type: ${{ inputs.build_type }}
      should_push: ${{ inputs.should_push }}
      soc: ${{ inputs.soc }}
      swr_registry: ${{ inputs.swr_registry }}
      swr_base_repo: ${{ inputs.swr_base_repo }}
      swr_temp_repo: ${{ inputs.swr_temp_repo }}
      nightly_release_repo: ${{ inputs.nightly_release_repo }}
      cann_swr_url: ${{ inputs.cann_swr_url }}
      isolated_build: ${{ inputs.isolated_build }}
      PR_ref: ${{ inputs.PR_ref }}
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
      SYNC_TOOLS_TOKEN: ${{ secrets.SYNC_TOOLS_TOKEN }}
