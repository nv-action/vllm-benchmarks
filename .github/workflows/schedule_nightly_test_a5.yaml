# This workflow related to the resources atlas 800 A5
name: Nightly-A5

on:
  workflow_dispatch:
    inputs:
      vllm_ascend_branch:
        description: 'Branch to test'
        required: true
        default: 'main'
        type: string
      test_cases:
        description: 'Test cases to run (comma‑separated, e.g., "qwen3‑32b,accuracy‑group" or "all" for all tests)'
        required: false
        default: 'all'
        type: string
      request_id:
        description: 'Unique request ID from the triggering workflow for run identification'
        required: false
        default: ''
        type: string
      skip_build_image:
        description: 'Skip build‑image job (used when triggered by /nightly command)'
        required: false
        default: 'false'
        type: string
      vllm_ascend_ref:
        description: 'PR commit SHA for PR‑triggered tests'
        required: false
        default: ''
        type: string
      aop_enabled:
        description: 'Enable AOP hooks (capture / classify / skip‑or‑process)'
        required: false
        default: false
        type: boolean
      build_type:
        description: 'Build type: daily or release.'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - daily
      cann_version:
        description: 'CANN version for base image tag'
        required: false
        default: '2026.08.03'
        type: string
  workflow_call:
    inputs:
      vllm_ascend_branch:
        required: true
        type: string
      test_cases:
        required: false
        default: 'all'
        type: string
      request_id:
        required: false
        default: ''
        type: string
      skip_build_image:
        required: false
        default: 'false'
        type: string
      vllm_ascend_ref:
        required: false
        default: ''
        type: string
      aop_enabled:
        required: false
        default: false
        type: boolean
      build_type:
        required: false
        default: 'release'
        type: string
      cann_version:
        required: false
        default: '2026.08.03'
        type: string
  repository_dispatch:
    types: [run‑a5‑nightly]

permissions:
  contents: read
  pull-requests: read
  issues: read

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: >-
    ascend-nightly-${{
      github.event_name == 'repository_dispatch'
        && fromJson(github.event.client_payload).vllm_ascend_branch
        || inputs.vllm_ascend_branch
    }}-a5${{
      ((github.event_name == 'repository_dispatch' && fromJson(github.event.client_payload).request_id) || inputs.request_id)
      && format('-{0}', (github.event_name == 'repository_dispatch' && fromJson(github.event.client_payload).request_id) || inputs.request_id)
      || ''
    }}
  cancel-in-progress: true

env:
  ASCEND_LOG_PREFIX: '/root/.cache/ascend-logs'

jobs:
  read-dispatch-payload:
    name: Read repository_dispatch payload
    if: github.event_name == 'repository_dispatch'
    runs-on: linux-amd64-cpu-8-hk
    outputs:
      vllm_ascend_branch: ${{ fromJson(github.event.client_payload).vllm_ascend_branch }}
      test_cases: ${{ fromJson(github.event.client_payload).test_cases }}
      request_id: ${{ fromJson(github.event.client_payload).request_id || '' }}
      skip_build_image: ${{ fromJson(github.event.client_payload).skip_build_image }}
      vllm_ascend_ref: ${{ fromJson(github.event.client_payload).vllm_ascend_ref || '' }}
      aop_enabled: ${{ fromJson(github.event.client_payload).aop_enabled }}
      build_type: ${{ fromJson(github.event.client_payload).build_type }}
      cann_version: ${{ fromJson(github.event.client_payload).cann_version }}
    steps:
      - run: echo "Successfully read repository_dispatch client_payload"

  parse-trigger:
    name: Parse trigger and determine test scope
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'repository_dispatch'
    needs: [read-dispatch-payload]
    runs-on: linux-aarch64-a5-0
    outputs:
      run: ${{ steps.parse.outputs.run }}
      filter: ${{ steps.parse.outputs.filter }}
      ref: ${{ steps.parse.outputs.ref }}
    steps:
      - name: Parse trigger
        id: parse
        uses: actions/github-script@v9
        with:
          script: |
            const eventName = context.eventName;
            let testCases;
            let refVal;
            if (eventName === 'repository_dispatch') {
              const payload = context.payload.client_payload;
              testCases = (payload.test_cases || '').trim();
              refVal = payload.vllm_ascend_ref || context.sha || 'unknown';
            } else {
              testCases = '${{ inputs.test_cases }}'.trim();
              refVal = context.sha || 'unknown';
            }

            core.setOutput('ref', refVal);

            if (testCases) {
              core.setOutput('run', 'true');
              if (testCases === 'all') {
                core.setOutput('filter', 'all');
              } else {
                core.setOutput('filter', ',' + testCases.split(',').map(s => s.trim()).join(',') + ',');
              }
              return;
            }
            core.setOutput('run', 'false');
            core.setOutput('filter', '');

  setup-vars:
    name: Export global env vars as job outputs
    needs: [parse-trigger, read-dispatch-payload]
    runs-on: linux-amd64-cpu-8-hk
    outputs:
      ascend_log_prefix: ${{ steps.export.outputs.ascend_log_prefix }}
      vllm_ascend_branches: ${{ steps.export.outputs.vllm_ascend_branches }}
      multi_node: ${{ steps.set-matrix.outputs.multi_node }}
      single_node: ${{ steps.set-matrix.outputs.single_node }}
    steps:
      - id: export
        run: |
          {
            echo "ascend_log_prefix=${{ env.ASCEND_LOG_PREFIX }}"
          } >> $GITHUB_OUTPUT
          {
            if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
              input_branch="${{ needs.read-dispatch-payload.outputs.vllm_ascend_branch }}"
            else
              input_branch="${{ inputs.vllm_ascend_branch }}"
            fi
            normalized=$(echo "$input_branch" | tr '/' '-')
            echo "vllm_ascend_branches=[\"${normalized}\"]"
          } >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: >-
            ${{
              github.event_name == 'repository_dispatch'
              && needs.read-dispatch-payload.outputs.vllm_ascend_branch
              || inputs.vllm_ascend_branch
            }}

      - name: Checkout PR code
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.vllm_ascend_ref != '')
          || (github.event_name == 'repository_dispatch' && needs.read-dispatch-payload.outputs.vllm_ascend_ref != '')
        uses: actions/checkout@v7
        with:
          ref: >-
            ${{
              github.event_name == 'repository_dispatch'
              && needs.read-dispatch-payload.outputs.vllm_ascend_ref
              || inputs.vllm_ascend_ref
            }}
          sparse-checkout: .github/workflows/configs/
          path: ./pr

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Read A5 test matrix config
        id: set-matrix
        env:
          MATRIX_FILE: >-
            ${{
              ((github.event_name == 'workflow_dispatch' && inputs.vllm_ascend_ref != '')
              || (github.event_name == 'repository_dispatch' && needs.read-dispatch-payload.outputs.vllm_ascend_ref != ''))
              && './pr/.github/workflows/configs/nightly_config.yaml'
              || '.github/workflows/configs/nightly_config.yaml'
            }}
          MATRIX_OUTPUTS: '{"multi_node":"a5.multi_node.test_config","single_node":"a5.single_node.test_config"}'
        run: |
          python3 -m pip install pyyaml -q
          python3 .github/workflows/scripts/resolve_nightly_tests.py --mode=matrix

  multi-node-tests:
    name: multi-node
    needs: [setup-vars, parse-trigger, read-dispatch-payload]
    if: >-
      always() &&
      needs.parse-trigger.outputs.run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        vllm_ascend_branch: ${{ fromJSON(needs.setup-vars.outputs.vllm_ascend_branches) }}
        test_config: ${{ fromJson(needs.setup-vars.outputs.multi_node) }}
    uses: ./.github/workflows/_e2e_nightly_multi_node.yaml
    with:
      soc_version: a5
      runner: linux-aarch64-a5-0
      image: swr.cn-north-4.myhuaweicloud.com/inference/vllm-ascend-temp:daily-main-a5-cann2026.08.03-20260805-arm64
      ascend_log_prefix: ${{ needs.setup-vars.outputs.ascend_log_prefix }}/${{ matrix.vllm_ascend_branch }}
      vllm_ascend_branch: ${{ matrix.vllm_ascend_branch }}
      replicas: 1
      size: ${{ matrix.test_config.size }}
      config_file_path: ${{ matrix.test_config.config_file_path }}
      name: ${{ matrix.test_config.name }}
      vllm_ascend_ref: >-
        ${{
          github.event_name == 'repository_dispatch'
          && needs.read-dispatch-payload.outputs.vllm_ascend_ref
          || inputs.vllm_ascend_ref
          || needs.parse-trigger.outputs.ref
        }}
      aop_multi_enabled: >-
        ${{
          github.event_name == 'repository_dispatch'
          && needs.read-dispatch-payload.outputs.aop_enabled
          || inputs.aop_enabled
        }}
      request_id: >-
        ${{
          github.event_name == 'repository_dispatch'
          && needs.read-dispatch-payload.outputs.request_id
          || inputs.request_id
          || ''
        }}
      should_run: >-
        ${{
          needs.parse-trigger.outputs.run == 'true' && (
            needs.parse-trigger.outputs.filter == 'all' ||
            contains(needs.parse-trigger.outputs.filter, format(',{0},', matrix.test_config.name))
          )
        }}
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      OBS_ACCESS_KEY_ID: ${{ secrets.OBS_ACCESS_KEY_ID }}
      OBS_SECRET_ACCESS_KEY: ${{ secrets.OBS_SECRET_ACCESS_KEY }}

  single-node-tests:
    name: single-node
    needs: [setup-vars, parse-trigger, read-dispatch-payload]
    if: >-
      always() &&
      needs.parse-trigger.outputs.run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        vllm_ascend_branch: ${{ fromJSON(needs.setup-vars.outputs.vllm_ascend_branches) }}
        test_config: ${{ fromJson(needs.setup-vars.outputs.single_node) }}
    uses: ./.github/workflows/_e2e_nightly_single_node.yaml
    with:
      runner: ${{ matrix.test_config.os }}
      image: swr.cn-north-4.myhuaweicloud.com/inference/vllm-ascend-temp:daily-main-a5-cann2026.08.03-20260805-arm64
      config_file_path: ${{ matrix.test_config.config_file_path }}
      name: ${{ matrix.test_config.name }}
      should_run: >-
        ${{
          needs.parse-trigger.outputs.run == 'true' && (
            needs.parse-trigger.outputs.filter == 'all' ||
            contains(needs.parse-trigger.outputs.filter, format(',{0},', matrix.test_config.name))
          )
        }}
      request_id: >-
        ${{
          github.event_name == 'repository_dispatch'
          && needs.read-dispatch-payload.outputs.request_id
          || inputs.request_id
          || ''
        }}
      vllm_ascend_ref: >-
        ${{
          github.event_name == 'repository_dispatch'
          && needs.read-dispatch-payload.outputs.vllm_ascend_ref
          || inputs.vllm_ascend_ref
          || ''
        }}
      aop_single_enabled: >-
        ${{
          github.event_name == 'repository_dispatch'
          && needs.read-dispatch-payload.outputs.aop_enabled
          || inputs.aop_enabled
        }}
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      OBS_ACCESS_KEY_ID: ${{ secrets.OBS_ACCESS_KEY_ID }}
      OBS_SECRET_ACCESS_KEY: ${{ secrets.OBS_SECRET_ACCESS_KEY }}

  clear-pre-logs:
    runs-on: linux-aarch64-a5-0
    needs: [multi-node-tests, read-dispatch-payload]
    if: needs.multi-node-tests.result != 'skipped'
    steps:
      - name: Clear pre-logs on pvc
        run: |
          rm -rf "${ASCEND_LOG_PREFIX:?}"/* || true

  merge-benchmark-artifacts:
    name: Merge benchmark artifacts into nightly-a5.zip
    needs: [parse-trigger, single-node-tests, multi-node-tests, read-dispatch-payload]
    if: >-
      always() &&
      needs.parse-trigger.result == 'success'
    runs-on: linux-amd64-cpu-8-hk
    steps:
      - name: Merge all benchmark result artifacts
        continue-on-error: true
        uses: actions/upload-artifact/merge@v7
        with:
          name: nightly-a5
          pattern: nightly-test-benchmark-results-*
          compression-level: 0
          delete-merged: true
