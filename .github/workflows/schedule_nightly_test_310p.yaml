# This workflow related to the resources atlas 310P
# **Please note**: current 310P resource pool's maximum allowed concurrency is 5*16 NPUs
# We will limit the concurrency of jobs on 310P to avoid the risk of insufficient resources
name: Nightly-310P

on:
  workflow_dispatch:
    inputs:
      vllm_ascend_branch:
        description: 'Branch to test'
        required: true
        default: 'main'
        type: string
      test_cases:
        description: 'Test cases to run (comma-separated, e.g., "test_custom_op,qwen3-32b,accuracy-group" or "all" for all tests)'
        required: false
        default: 'all'
        type: string
      request_id:
        description: 'Unique request ID from the triggering workflow for run identification'
        required: false
        default: ''
        type: string
      skip_build_image:
        description: 'Skip build-image job (used when triggered by /nightly command)'
        required: false
        default: 'false'
        type: string
      vllm_ascend_ref:
        description: 'PR commit SHA for PR-triggered tests'
        required: false
        default: ''
        type: string
      aop_enabled:
        description: 'Enable AOP hooks (capture / classify / skip-or-process)'
        required: false
        default: false
        type: boolean
      build_type:
        description: 'Build type: daily or release.'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - daily
      base_image_tag:
        description: 'Base image tag params. Default auto-picks latest image; set a date (YYYYMMDD) to pin it.'
        required: false
        default: '{"cann_version":"9.1.0_20260731131545","base_image_date":"auto"}'
        type: string
      profile_options_json:
        description: 'JSON profiling options: enabled, start_after, duration, with_stack, scope, max_size, output, cases'
        type: string
        default: '{}'

permissions:
  contents: read
  pull-requests: read
  issues: read

# Bash shells do not use ~/.profile or ~/.bashrc so these shells need to be explicitly
# declared as "shell: bash -el {0}" on steps that need to be properly activated.
# It's used to activate ascend-toolkit environment variables.
defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: ascend-nightly-${{ github.ref }}-310p${{ inputs.request_id && format('-{0}', inputs.request_id) || '' }}
  cancel-in-progress: true

env:
  # Single source of truth for all shared variables across jobs.
  # NOTE: GitHub Actions does not support env context in reusable workflow `with:` inputs,
  # so these values are exported as job outputs via the `setup-vars` job below.
  ASCEND_LOG_PREFIX: '/root/.cache/ascend-logs'

jobs:
  parse-trigger:
    name: Parse trigger and determine test scope
    if: >-
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.parse.outputs.run }}
      filter: ${{ steps.parse.outputs.filter }}
      ref: ${{ steps.parse.outputs.ref }}
    steps:
      - name: Parse trigger
        id: parse
        uses: actions/github-script@v9
        with:
          script: |
            const eventName = context.eventName;
            const testCases = '${{ inputs.test_cases }}'.trim();

            core.setOutput('ref', context.sha || 'unknown');

            if (testCases) {
              core.setOutput('run', 'true');
              if (testCases === 'all') {
                core.setOutput('filter', 'all');
              } else {
                core.setOutput('filter', ',' + testCases.split(',').map(s => s.trim()).join(',') + ',');
              }
              return;
            }

            core.setOutput('run', 'false');
            core.setOutput('filter', '');

  setup-vars:
    name: Export global env vars as job outputs
    needs: parse-trigger
    runs-on: ubuntu-latest
    outputs:
      ascend_log_prefix: ${{ steps.export.outputs.ascend_log_prefix }}
      vllm_ascend_branches: ${{ steps.export.outputs.vllm_ascend_branches }}
      multi_node: ${{ steps.set-matrix.outputs.multi_node }}
      double_node: ${{ steps.set-matrix.outputs.double_node }}
      single_node: ${{ steps.set-matrix.outputs.single_node }}
      multi_card: ${{ steps.set-matrix.outputs.multi_card }}
    steps:
      - id: export
        run: |
          {
            echo "ascend_log_prefix=${{ env.ASCEND_LOG_PREFIX }}"
            input_branch="${{ inputs.vllm_ascend_branch }}"
            normalized=$(echo "$input_branch" | tr '/' '-')
            echo "vllm_ascend_branches=[\"${normalized}\"]"
          } >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.vllm_ascend_branch }}

      - name: Checkout PR code
        if: github.event_name == 'workflow_dispatch' && inputs.vllm_ascend_ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.vllm_ascend_ref }}
          sparse-checkout: .github/workflows/configs/
          path: ./pr

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Read 310P test matrix config
        id: set-matrix
        env:
          MATRIX_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.vllm_ascend_ref != '' && './pr/.github/workflows/configs/nightly_config.yaml' || '.github/workflows/configs/nightly_config.yaml' }}
          MATRIX_OUTPUTS: '{"single_node":"310p.single_node.test_config","multi_card":"310p.multi_card.test_config"}'
        run: |
          python3 -m pip install pyyaml -q
          python3 .github/workflows/scripts/resolve_nightly_tests.py --mode=matrix

  build-image:
    name: Build nightly-310p image
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.skip_build_image != 'true')
    strategy:
      matrix:
        vllm_ascend_branch: >-
          ${{ fromJSON(format('["{0}"]', inputs.vllm_ascend_branch)) }}
    uses: ./.github/workflows/_nightly_image_build.yaml
    with:
      target: 310p
      vllm_ascend_branch: ${{ matrix.vllm_ascend_branch }}
      build_type: ${{ inputs.build_type }}
      should_push: ${{ github.repository == 'vllm-project/vllm-ascend' && github.event_name != 'pull_request' }}
      soc: '310p'
      cann_version: ${{ fromJSON(inputs.base_image_tag).cann_version }}
      base_image_date: ${{ fromJSON(inputs.base_image_tag).base_image_date }}
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
      SYNC_TOOLS_TOKEN: ${{ secrets.SYNC_TOOLS_TOKEN }}

  single-node-tests:
    name: single-node
    needs: [setup-vars, parse-trigger, build-image]
    if: >-
      always() &&
      needs.parse-trigger.outputs.run == 'true' &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        vllm_ascend_branch: ${{ fromJSON(needs.setup-vars.outputs.vllm_ascend_branches) }}
        test_config: ${{ fromJson(needs.setup-vars.outputs.single_node) }}
    uses: ./.github/workflows/_e2e_nightly_single_node.yaml
    with:
      runner: ${{ matrix.test_config.os }}
      soc_version: 310p
      image: 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:nightly-ci-${{ matrix.vllm_ascend_branch }}-310p'
      config_file_path: ${{ matrix.test_config.config_file_path }}
      config_base_path: ${{ matrix.test_config.config_base_path }}
      name: ${{ matrix.test_config.name }}
      vllm_ascend_branch: ${{ matrix.vllm_ascend_branch }}
      should_run: >-
        ${{
          needs.parse-trigger.outputs.run == 'true' && (
            needs.parse-trigger.outputs.filter == 'all' ||
            contains(needs.parse-trigger.outputs.filter, format(',{0},', matrix.test_config.name))
          )
        }}
      request_id: ${{ inputs.request_id || '' }}
      vllm_ascend_ref: ${{ inputs.vllm_ascend_ref || '' }}
      aop_single_enabled: ${{ inputs.aop_enabled }}
      bisect_config_base_path: ${{ matrix.test_config.config_base_path }}
      profile_enabled: ${{ fromJSON(inputs.profile_options_json || '{}').enabled || false }}
      profile_start_after: ${{ fromJSON(inputs.profile_options_json || '{}').start_after || '15' }}
      profile_duration: ${{ fromJSON(inputs.profile_options_json || '{}').duration || '8' }}
      profile_with_stack: ${{ fromJSON(inputs.profile_options_json || '{}').with_stack || false }}
      profile_scope: ${{ fromJSON(inputs.profile_options_json || '{}').scope || 'representative' }}
      profile_max_size: ${{ fromJSON(inputs.profile_options_json || '{}').max_size || '50G' }}
      profile_output: ${{ fromJSON(inputs.profile_options_json || '{}').output || 'parsed' }}
      profile_cases: ${{ fromJSON(inputs.profile_options_json || '{}').cases || '' }}
    secrets:
      OBS_ACCESS_KEY_ID: ${{ secrets.OBS_ACCESS_KEY_ID }}
      OBS_SECRET_ACCESS_KEY: ${{ secrets.OBS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}


  merge-benchmark-artifacts:
    name: Merge benchmark artifacts into nightly-310p.zip
    needs: [parse-trigger, single-node-tests]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.parse-trigger.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge all benchmark result artifacts
        continue-on-error: true
        uses: actions/upload-artifact/merge@v7
        with:
          name: nightly-310p
          pattern: nightly-test-benchmark-results-*
          compression-level: 0
          delete-merged: true

  parse-single-node-profile:
    name: Parse single-node profile
    needs: [setup-vars, parse-trigger, single-node-tests]
    if: >-
      always() &&
      fromJSON(inputs.profile_options_json || '{}').enabled &&
      (fromJSON(inputs.profile_options_json || '{}').output || 'parsed') == 'parsed' &&
      needs.setup-vars.result == 'success' &&
      needs.single-node-tests.result != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        vllm_ascend_branch: ${{ fromJSON(needs.setup-vars.outputs.vllm_ascend_branches) }}
        test_config: ${{ fromJSON(needs.setup-vars.outputs.single_node) }}
    uses: ./.github/workflows/_e2e_profile_parse.yaml
    with:
      runner: linux-aarch64-a2b3-1
      image: 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:nightly-ci-${{ matrix.vllm_ascend_branch }}-310p'
      ref: ${{ github.sha }}
      display_name: ${{ matrix.test_config.config_file_path || matrix.test_config.name }}
      prefix: nightly-profiling/${{ github.repository }}/${{ github.run_id }}/${{ github.run_attempt }}/single-node/${{ matrix.vllm_ascend_branch }}-${{ matrix.test_config.name }}
      should_run: >-
        ${{ needs.parse-trigger.outputs.filter == 'all' ||
            contains(needs.parse-trigger.outputs.filter, format(',{0},', matrix.test_config.name)) }}
    secrets: inherit
