# TEMPORARY: diagnose the main2main format.sh stall on the a3-16 pool.
#
# Five nightly runs (10-19..10-26) froze at the first pre-commit call with no
# output, and every cancelled job's "Stop containers" step never finished.
# This probe is READ-ONLY: it inspects the shared pre-commit store on
# /root/.cache (NFS) and takes the store lock non-blockingly to see whether a
# leftover pre-commit from an earlier container still holds it.  It never
# runs a hook and never holds the lock.
#
# Dispatch:
#   gh workflow run temp_probe_precommit_lock.yaml --ref wf/harness-parity
# Delete this file once the stall is explained.
name: 'temp: probe pre-commit store lock'

on:
  workflow_dispatch:
  # The fork's API cannot dispatch a workflow that is absent from the default
  # branch; a self-referential push (this file only) is the dispatch path.
  push:
    paths:
      - .github/workflows/temp_probe_precommit_lock.yaml

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: Probe shared pre-commit store (a3-16)
    runs-on: linux-aarch64-a3-16-sh-001
    timeout-minutes: 10
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12
    steps:
      - name: Inspect the shared cache and store lock
        run: |
          set -u
          echo "== identity =="
          echo "host=$(hostname)"
          echo "user=$(id -un) home=$HOME arch=$(uname -m)"
          echo "procs_visible=$(ls /proc | grep -c '^[0-9]')"
          echo "== cache mount =="
          df -T "$HOME/.cache" 2>&1 | tail -2 || true
          mount 2>/dev/null | grep -E "on $HOME/.cache " || true
          echo "== store dir =="
          STORE="$HOME/.cache/main2main-pre-commit-a3-16-$(uname -m)"
          echo "store=$STORE"
          ls -la "$STORE" 2>&1 | head -40 || echo "MISSING store dir"
          echo "== lock file =="
          stat "$STORE/.lock" 2>&1 || echo "MISSING .lock"
          echo "== non-blocking flock probe =="
          python3 - "$STORE/.lock" <<'PY'
          import fcntl, os, sys
          p = sys.argv[1]
          if not os.path.exists(p):
              print("PROBE: no lock file -> store was never created in this cache")
              sys.exit(0)
          fd = os.open(p, os.O_RDWR | os.O_CREAT, 0o644)
          try:
              fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
              print("PROBE: LOCK FREE")
              fcntl.flock(fd, fcntl.LOCK_UN)
          except BlockingIOError:
              print("PROBE: LOCK HELD by another process")
          except OSError as exc:
              print(f"PROBE: flock error: {exc}")
          finally:
              os.close(fd)
          PY
          echo "== processes visible in this namespace =="
          ps -ef 2>/dev/null | grep -E 'pre-commit|pre_commit|format\.sh' | grep -v grep || echo "(none)"
          echo "== lock holders (fuser/lsof if present) =="
          if command -v fuser >/dev/null; then fuser -v "$STORE/.lock" 2>&1 || true; else echo "(fuser unavailable)"; fi
          if command -v lsof >/dev/null; then lsof "$STORE/.lock" 2>&1 || true; else echo "(lsof unavailable)"; fi
          echo "== store size / last activity =="
          du -sh "$STORE" 2>/dev/null || true
          find "$STORE" -maxdepth 1 -printf '%TY-%Tm-%Td %TH:%TM %f\n' 2>/dev/null | sort | tail -20 || true
