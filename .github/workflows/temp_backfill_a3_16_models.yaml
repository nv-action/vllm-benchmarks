# TEMPORARY: backfill the model cache of the dedicated main2main runner pool.
#
# Root cause of run 34084313012 e2e ValueErrors ("Cannot find the requested
# files in the cached path"): two repos from the a3 list were never
# downloaded to the pool's NFS cache (178.27.1.16:/share mounted at
# /root/.cache) — the traceback repo_ids are authoritative:
#   - test_qwen3_8b_w8a8.py      -> repo_id = vllm-ascend/Qwen3-8B-W8A8 (model)
#   - test_disaggregated_encoder -> repo_id = vllm-ascend/mm_request  (dataset fixture)
# The eagle3 / Qwen2.5-VL-7B / whisper repos I chased first were a misread:
# they are in the cache since Aug 24 and offline-read fine with modelscope
# 1.37.1 (the version the e2e installs, run log "+ modelscope==1.37.1").
#
# Same shape as previous iterations: cann container (the e2e job's
# /root/.cache is the container's NFS mount), modelscope<1.38 in an
# isolated venv — keeps the legacy hub/models/{org}/{name} layout the
# offline e2e jobs read, and leaves the image's vllm-deps modelscope
# untouched.  Dots in repo names are stored as triple underscores.
#
# Delete this file once both repos are confirmed offline-readable.
name: 'temp: backfill a3-16 model cache'

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'ModelScope MODEL ids (one per line), downloaded to /root/.cache/modelscope'
        required: false
        default: |
          vllm-ascend/Qwen3-8B-W8A8
      datasets:
        description: 'ModelScope DATASET ids (one per line)'
        required: false
        default: |
          vllm-ascend/mm_request

defaults:
  run:
    shell: bash -el {0}

jobs:
  backfill:
    name: Download models on a3-16
    runs-on: linux-aarch64-a3-16-sh-001
    timeout-minutes: 240
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12
    steps:
      - name: Pre-check cache state (fs + node fingerprint)
        run: |
          echo "runner=$(hostname)"
          echo "fs-of-cache: $(df -T /root/.cache 2>/dev/null | tail -1)"
          du -sh /root/.cache/modelscope 2>/dev/null || echo "(no modelscope cache yet)"
          for d in \
            /root/.cache/modelscope/hub/models/vllm-ascend/Qwen3-8B-W8A8 \
            /root/.cache/modelscope/hub/datasets/vllm-ascend/mm_request; do
            if [ -d "$d" ]; then du -sh "$d"; else echo "MISSING $d"; fi
          done
          ls /root/.cache/vllm/vllm_public_assets/ 2>/dev/null || echo "(no vllm public assets yet)"

      - name: Install modelscope<1.38 in an isolated venv
        run: |
          set -euxo pipefail
          python3 -m venv /tmp/msdl_venv
          /tmp/msdl_venv/bin/pip install -q \
            -i https://repo.huaweicloud.com/repository/pypi/simple \
            "modelscope<1.38"
          /tmp/msdl_venv/bin/python -c \
            "import modelscope; print('modelscope', modelscope.__version__)"

      - name: Download models and datasets
        env:
          MODELS: ${{ github.event.inputs.models }}
          DATASETS: ${{ github.event.inputs.datasets }}
        run: |
          set -euo pipefail
          failed=""
          while read -r model; do
            [ -z "$model" ] && continue
            echo "▶ Downloading model $model"
            t0=$SECONDS
            if ! /tmp/msdl_venv/bin/modelscope download "$model"; then
              failed="$failed $model"
            fi
            echo "[took $((SECONDS - t0))s] $model"
          done <<< "$MODELS"
          while read -r ds; do
            [ -z "$ds" ] && continue
            echo "▶ Downloading dataset $ds"
            t0=$SECONDS
            if ! /tmp/msdl_venv/bin/modelscope download --repo_type dataset "$ds"; then
              failed="$failed $ds"
            fi
            echo "[took $((SECONDS - t0))s] $ds"
          done <<< "$DATASETS"
          [ -z "$failed" ] || exit "download failed:$failed"

      - name: Reproduce the e2e offline read (modelscope 1.37, no network)
        env:
          MODELS: ${{ github.event.inputs.models }}
          DATASETS: ${{ github.event.inputs.datasets }}
        run: |
          set -uxo pipefail
          # the e2e installs modelscope<1.38 via requirements-dev.txt
          # (resolved 1.37.1 in run 34084313012) — the isolated venv above
          # carries the same family, so its offline scan is faithful
          HF_HUB_OFFLINE=1 /tmp/msdl_venv/bin/python - <<'PY'
          import os
          from modelscope import snapshot_download
          import traceback
          models = [m for m in os.environ.get("MODELS", "").splitlines() if m]
          dsets = [d for d in os.environ.get("DATASETS", "").splitlines() if d]
          for m in models:
              try:
                  p = snapshot_download(m, local_files_only=True)
                  print(f"[OFFLINE-OK model] {m} -> {p}", flush=True)
              except Exception as e:
                  print(f"[OFFLINE-FAIL model] {m}: {type(e).__name__}: {e}",
                        flush=True)
                  traceback.print_exc()
          for d in dsets:
              try:
                  p = snapshot_download(d, repo_type="dataset",
                                        local_files_only=True)
                  print(f"[OFFLINE-OK dataset] {d} -> {p}", flush=True)
              except Exception as e:
                  print(f"[OFFLINE-FAIL dataset] {d}: {type(e).__name__}: {e}",
                        flush=True)
                  traceback.print_exc()
          PY

      - name: Verify cache layout
        if: always()
        run: |
          du -sh /root/.cache/modelscope
          find /root/.cache/modelscope/hub -maxdepth 3 \
            \( -iname "*W8A8*" -o -iname "*mm_request*" \) | sort
          find /root/.cache/modelscope/hub/models/vllm-ascend \
            -name "*.safetensors" -size +100M -exec ls -la {} \; 2>/dev/null
