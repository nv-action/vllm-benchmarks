name: Test v0.23 Incremental Doc Translation

on:
  push:
    branches:
      - test/v023-tab-table-i18n-incremental
  workflow_dispatch:

concurrency:
  group: v023-incremental-translation-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: linux-amd64-cpu-8-hk
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build docs and generate PO files
        working-directory: ./docs
        run: |
          sudo apt-get update && sudo apt-get install -y make
          pip install -r requirements-docs.txt
          make clean && make html
          sphinx-build -b gettext source _build/gettext

          # Exercise one catalog only. This keeps the test incremental even
          # when the release branch contains other untranslated doc updates.
          test -f _build/gettext/quick_start.pot
          grep -F 'msgid "Supported version"' _build/gettext/quick_start.pot
          grep -F 'msgid "Required for CANN"' _build/gettext/quick_start.pot
          grep -F "msgid \"Uninstalled in \`Dockerfile.310p\`\"" \
            _build/gettext/quick_start.pot

          mkdir -p _build/gettext-incremental
          cp _build/gettext/quick_start.pot _build/gettext-incremental/
          sphinx-intl update \
            -p _build/gettext-incremental \
            -d source/locale \
            -l zh_CN

      - name: Detect PO files to translate
        id: detect
        run: |
          expected=docs/source/locale/zh_CN/LC_MESSAGES/quick_start.po
          mapfile -t po_files < <(
            {
              git diff --name-only --diff-filter=ACMUX
              git ls-files --others --exclude-standard
            } | grep '\.po$' | sort -u
          )

          if [ "${#po_files[@]}" -ne 1 ] || [ "${po_files[0]}" != "$expected" ]; then
            echo "Expected only $expected to change; found:"
            printf '%s\n' "${po_files[@]}"
            exit 1
          fi

          echo "Incremental PO file: $expected"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "files=$expected" >> "$GITHUB_OUTPUT"

      - name: Translate pending entries with DeepSeek
        if: steps.detect.outputs.has_changes == 'true'
        id: translate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python .github/workflows/scripts/po_translate.py \
            --files "${{ steps.detect.outputs.files }}" \
            --output-json /tmp/translation_results.json

      - name: Validate translated PO files
        if: steps.translate.outcome == 'success'
        run: |
          python .github/workflows/scripts/po_translate.py \
            --files "${{ steps.detect.outputs.files }}" \
            --validate-only
          make -C docs intl SPHINXOPTS="-W --keep-going"

      - name: Upload incremental translation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v023-incremental-quick-start-${{ github.run_id }}
          path: |
            /tmp/translation_results.json
            docs/source/locale/zh_CN/LC_MESSAGES/quick_start.po
          if-no-files-found: warn
          retention-days: 7
