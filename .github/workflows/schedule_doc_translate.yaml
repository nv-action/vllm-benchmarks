name: Auto Doc Translate

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Compatibility input; the selected workflow ref is tested'
        required: false
        default: 'test/v023-doc-translate'
        type: string
      force:
        description: 'Retranslate all PO files'
        required: false
        default: false
        type: boolean

concurrency:
  group: translation-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: linux-amd64-cpu-8-hk
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build docs and generate PO files
        working-directory: ./docs
        run: |
          sudo apt-get update && sudo apt-get install -y make
          pip install -r requirements-docs.txt
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Removing existing PO files before clean regeneration"
            find source/locale/zh_CN/LC_MESSAGES \
              -type f -name '*.po' -delete
          fi
          make clean && make html
          sphinx-build -b gettext source _build/gettext
          sphinx-intl update -p _build/gettext -l zh_CN

      - name: Detect PO files to translate
        id: detect
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            po_files=$(find docs/source/locale/zh_CN/LC_MESSAGES \
              -type f -name '*.po' -print | sort | tr '\n' ',' | sed 's/,$//')
          else
            tracked=$(git diff --name-only --diff-filter=ACMUX || true)
            untracked=$(git ls-files --others --exclude-standard || true)
            po_files=$(printf "%s\n%s" "$tracked" "$untracked" \
              | grep '\.po$' | tr '\n' ',' | sed 's/,$//' || true)
          fi

          if [ -z "$po_files" ]; then
            echo "No PO files to translate"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "files=$po_files" >> "$GITHUB_OUTPUT"
          fi

      - name: Translate PO files with DeepSeek
        if: steps.detect.outputs.has_changes == 'true'
        id: translate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          RETRANSLATE_ARGS=()
          if [ "${{ inputs.force }}" = "true" ]; then
            RETRANSLATE_ARGS+=(--retranslate-all)
          fi
          python .github/workflows/scripts/po_translate.py \
            --files "${{ steps.detect.outputs.files }}" \
            --output-json /tmp/translation_results.json \
            "${RETRANSLATE_ARGS[@]}"

      - name: Validate translated PO files
        if: steps.translate.outcome == 'success'
        run: |
          python .github/workflows/scripts/po_translate.py \
            --files "${{ steps.detect.outputs.files }}" \
            --validate-only
          make -C docs intl SPHINXOPTS="-W --keep-going"

      - name: Upload translated PO files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v023-translated-po-${{ github.run_id }}
          path: |
            /tmp/translation_results.json
            docs/source/locale/zh_CN/LC_MESSAGES/**/*.po
          if-no-files-found: warn
          retention-days: 7
