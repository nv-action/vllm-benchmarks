name: Test v0.23 Incremental Doc Translation

on:
  push:
    branches:
      - test/v023-tab-table-i18n-incremental
  workflow_dispatch:

concurrency:
  group: v023-incremental-translation-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: linux-amd64-cpu-8-hk
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build docs and generate PO files
        working-directory: ./docs
        run: |
          sudo apt-get update && sudo apt-get install -y make
          pip install -r requirements-docs.txt
          make clean && make html
          sphinx-build -b gettext source _build/gettext

          # Verify representative tab-contained tables from every known
          # affected document before incrementally merging all catalogs.
          test -f _build/gettext/quick_start.pot
          test -f _build/gettext/installation.pot
          grep -F 'msgid "Supported version"' _build/gettext/quick_start.pot
          grep -F 'msgid "Required for CANN"' _build/gettext/quick_start.pot
          grep -F "msgid \"Uninstalled in \`Dockerfile.310p\`\"" \
            _build/gettext/quick_start.pot
          grep -F 'msgid "Supported version"' _build/gettext/installation.pot
          grep -F 'msgid "Required for CANN"' _build/gettext/installation.pot
          grep -F "msgid \"Uninstalled in \`Dockerfile.310p\`\"" \
            _build/gettext/installation.pot

          # Merge newly extracted messages into the existing catalogs. Do not
          # delete PO files or request a full retranslation.
          sphinx-intl update \
            -p _build/gettext \
            -d source/locale \
            -l zh_CN

      - name: Detect PO files to translate
        id: detect
        run: |
          mapfile -t po_files < <(
            {
              git diff --name-only --diff-filter=ACMUX
              git ls-files --others --exclude-standard
            } | grep '\.po$' | sort -u
          )

          if [ "${#po_files[@]}" -eq 0 ]; then
            echo "No PO files received newly extracted table messages"
            exit 1
          fi

          printf 'Incrementally updated PO: %s\n' "${po_files[@]}"
          po_files_csv=$(IFS=,; echo "${po_files[*]}")
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "files=$po_files_csv" >> "$GITHUB_OUTPUT"

      - name: Translate pending entries with DeepSeek
        if: steps.detect.outputs.has_changes == 'true'
        id: translate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python .github/workflows/scripts/po_translate.py \
            --files "${{ steps.detect.outputs.files }}" \
            --output-json /tmp/translation_results.json

      - name: Validate translated PO files
        if: steps.translate.outcome == 'success'
        run: |
          python .github/workflows/scripts/po_translate.py \
            --files "${{ steps.detect.outputs.files }}" \
            --validate-only
          make -C docs intl SPHINXOPTS="-W --keep-going"

      - name: Collect incrementally updated PO files
        if: steps.translate.outcome == 'success'
        run: |
          po_files_csv="${{ steps.detect.outputs.files }}"
          IFS=',' read -ra po_files <<< "$po_files_csv"
          for po_file in "${po_files[@]}"; do
            destination="/tmp/v023-incremental-po/$po_file"
            mkdir -p "$(dirname "$destination")"
            cp "$po_file" "$destination"
          done

      - name: Upload incremental translation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v023-incremental-tab-tables-${{ github.run_id }}
          path: |
            /tmp/translation_results.json
            /tmp/v023-incremental-po
          if-no-files-found: warn
          retention-days: 7
