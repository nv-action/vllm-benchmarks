name: Auto Doc Translate

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch that contains the documentation to translate'
        required: false
        default: 'main'
        type: string
      force:
        description: 'Force full regeneration of ALL .po files (discard existing translations)'
        required: false
        default: false
        type: boolean
      preview:
        description: 'Temporary preview build: stay in THIS repo (nv-action), push translated .po files to a temporary branch, open a preview PR and upload artifacts. Disable to run the full upstream PR pipeline.'
        required: false
        default: true
        type: boolean

concurrency:
  group: translation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: linux-amd64-cpu-8-hk
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.target_branch || 'main' }}

      - name: Setup git and branch
        run: |
          TARGET_BRANCH="${{ inputs.target_branch || 'main' }}"
          echo "TARGET_BRANCH=${TARGET_BRANCH}" >> $GITHUB_ENV

          PREVIEW="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.preview }}" = "true" ]; then
            PREVIEW="true"
          fi
          echo "PREVIEW=${PREVIEW}" >> "$GITHUB_ENV"

          if [ "$PREVIEW" = "true" ]; then
            BRANCH_PREFIX="preview/doc-translate"
          else
            BRANCH_PREFIX="auto-pr/doc-translate"
          fi
          BRANCH_NAME="${BRANCH_PREFIX}-$(date +%Y%m%d%H%M%S)"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git checkout -B "${BRANCH_NAME}"
          git remote add fork "https://github.com/vllm-ascend-ci/vllm-ascend.git" || true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build docs and generate PO files
        working-directory: ./docs
        run: |
          pip install -r requirements-docs.txt
          cd ..
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
          python .github/workflows/scripts/detect_po_changes.py --output-json /tmp/po_changes.json $FORCE_FLAG

      - name: Detect PO files to translate
        id: detect
        run: |
          [ ! -f /tmp/po_changes.json ] && echo "No changes detected" && exit 0

          has_changes=$(python3 -c "import json; print(json.load(open('/tmp/po_changes.json')).get('has_changes', False))")
          echo "has_changes=$has_changes" >> $GITHUB_OUTPUT

          if [ "$has_changes" = "True" ]; then
            files=$(python3 -c "
          import json
          with open('/tmp/po_changes.json') as f:
              data = json.load(f)
          print(','.join(data.get('files', [])))
          ")
            echo "files=$files" >> $GITHUB_OUTPUT
            echo "PO files: $files"
          else
            echo "No PO files to translate"
          fi

      - name: Translate PO files
        if: steps.detect.outputs.has_changes == 'true'
        id: translate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python .github/workflows/scripts/po_translate.py \
            --files "${{ steps.detect.outputs.files }}" \
            --output-json /tmp/translation_results.json \
            --ignore-validation-error

      - name: Validate translation coverage
        if: steps.translate.outcome == 'success'
        id: validate
        run: |
          python .github/workflows/scripts/po_translate.py \
            --files "${{ steps.detect.outputs.files }}" \
            --validate-only \
            --ignore-validation-error

      - name: Process translated files
        if: steps.translate.outcome == 'success'
        id: results
        run: |
          [ ! -f /tmp/translation_results.json ] && echo "No results" && exit 1

          success_files=$(python3 -c "
          import json, os
          with open('/tmp/translation_results.json') as f:
              for p in json.load(f).get('success_files', []):
                  if os.path.exists(p): print(p)
          ")
          [ -z "$success_files" ] && echo "No files translated" && exit 1

          count=0
          file_list=""
          mkdir -p /tmp/translated_po_files
          while IFS= read -r file; do
            [ -n "$file" ] && [ -f "$file" ] && {
              count=$((count + 1))
              file_list="${file_list}- <code>${file}</code>"$'\n'
              git add "$file"
              cp --parents "$file" /tmp/translated_po_files/
            }
          done <<< "$success_files"

          [ $count -eq 0 ] && echo "No files processed" && exit 1
          echo "Processed $count file(s)"
          {
            echo "file_count=$count"
            echo "file_list<<EOF"
            echo "$file_list"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Upload translation artifacts
        if: steps.translate.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: translated-po-${{ github.run_id }}
          path: |
            /tmp/translation_results.json
            /tmp/po_changes.json
            /tmp/translated_po_files
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Ascend brand spelling (preview only)
        if: steps.translate.outcome == 'success' && env.PREVIEW == 'true'
        run: |
          po_files=$(git diff --cached --name-only | grep '\.po$' || true)
          if [ -z "$po_files" ]; then
            echo "No translated PO files staged for terminology check"
            exit 0
          fi
          python3 - "$po_files" <<'PY'
          import sys
          from polib import pofile

          bad_token = "升腾"
          problems = []
          correct_uses = 0
          for f in sys.argv[1].split():
              po = pofile(f)
              for e in po:
                  if not e.msgstr:
                      continue
                  if bad_token in e.msgstr:
                      problems.append((f, "wrong_token 升腾", e.msgid[:60]))
                  correct_uses += e.msgstr.count("昇腾")
          if problems:
              print("TERMINOLOGY CHECK WARNINGS:")
              for p in problems[:50]:
                  print("  ", p[0], p[1], repr(p[2]))
              print(f"  total: {len(problems)} problem(s)")
          else:
              print(f"TERMINOLOGY CHECK OK: no wrong '升腾' (correct '昇腾' uses: {correct_uses})")
          PY
          exit 0

      - name: Commit and push (preview)
        if: steps.translate.outcome == 'success' && env.PREVIEW == 'true'
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --cached --quiet && echo "Nothing to commit" && exit 1
          count=$(git diff --cached --name-only | wc -l)
          git commit -s -m "[Doc] Auto-translate preview ${count} file(s)"
          git push -u "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH_NAME}"
          echo "preview_branch=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create preview PR in this repo
        if: steps.translate.outcome == 'success' && env.PREVIEW == 'true'
        uses: actions/github-script@v9
        env:
          FILE_LIST: ${{ steps.results.outputs.file_list }}
          FILE_COUNT: ${{ steps.results.outputs.file_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_HEAD: ${{ env.BRANCH_NAME }}
          PR_BASE: ${{ env.TARGET_BRANCH }}
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            try {
              const branchLabel = process.env.PR_BASE.split('/').pop();
              const date = new Date().toISOString().slice(0, 10);
              const prTitle = branchLabel === 'main'
                ? '[Doc][Preview] Translated Doc files ' + date
                : '[' + branchLabel + '][Doc][Preview] Translated Doc files ' + date;
              const prBody = '## Temporary Preview Translation (new prompt verification)\n\n' +
                'Translated **' + process.env.FILE_COUNT + '** file(s) incrementally with the updated prompt:\n\n' +
                process.env.FILE_LIST + '\n---\n\n' +
                '[Workflow run](' + process.env.RUN_URL + ')\n\n' +
                'This PR is generated by a temporary preview build in this repo to verify the new translation prompt. ' +
                'It can be closed after review.';
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner, repo: context.repo.repo,
                head: process.env.PR_HEAD, base: process.env.PR_BASE,
                title: prTitle, body: prBody
              });
              core.info('Created preview PR #' + pr.data.number + ' in ' + context.repo.owner + '/' + context.repo.repo);
            } catch (error) {
              if (error.message.includes('A pull request already exists')) {
                core.warning('Preview PR already exists');
              } else { throw error; }
            }

      - name: Commit and push (upstream)
        if: steps.translate.outcome == 'success' && env.PREVIEW != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git diff --cached --quiet && echo "Nothing to commit" && exit 1
          count=$(git diff --cached --name-only | wc -l)
          git commit -s -m "[Doc] Auto-translate ${count} file(s)"
          git push -f fork "${{ env.BRANCH_NAME }}"

      - name: Create PR in upstream
        if: steps.translate.outcome == 'success' && env.PREVIEW != 'true'
        uses: actions/github-script@v9
        env:
          FILE_LIST: ${{ steps.results.outputs.file_list }}
          FILE_COUNT: ${{ steps.results.outputs.file_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_HEAD: vllm-ascend-ci:${{ env.BRANCH_NAME }}
          PR_BASE: ${{ env.TARGET_BRANCH }}
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            try {
              const branchLabel = process.env.PR_BASE.split('/').pop();
              const date = new Date().toISOString().slice(0, 10);
              const prTitle = branchLabel === 'main'
                ? '[Doc] Translated Doc files ' + date
                : '[' + branchLabel + '][Doc] Translated Doc files ' + date;
              const prBody = '## Auto-Translation Summary\n\n' +
                'Translated **' + process.env.FILE_COUNT + '** file(s):\n\n' +
                process.env.FILE_LIST + '\n---\n\n' +
                '[Workflow run](' + process.env.RUN_URL + ')';
              const pr = await github.rest.pulls.create({
                owner: 'vllm-project', repo: 'vllm-ascend',
                head: process.env.PR_HEAD, base: process.env.PR_BASE,
                title: prTitle, body: prBody
              });
              core.info('Created PR #' + pr.data.number);
            } catch (error) {
              if (error.message.includes('A pull request already exists')) {
                core.warning('PR already exists');
              } else { throw error; }
            }
