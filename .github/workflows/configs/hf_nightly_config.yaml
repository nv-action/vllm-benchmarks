# High-frequency nightly subset for daytime regression detection.
# The structure mirrors nightly_config.yaml and every `name` below MUST match
# a test case in nightly_config.yaml. Add/remove entries to tune the subset;
# the schedule_e2e_test.yaml workflow dispatches them via the
# schedule_nightly_test_<soc>.yaml workflows on the day-time schedule.

high_frequency:
  a2:
    multi_node:
      test_config:
        - name: multi-node-qwen3-235b-dp
        - name: multi-node-GLM-5.1-w8a8-A2
    single_node:
      test_config:
        - name: qwen3-30b-a3b-bf16-a2-performance
        - name: qwen3-vl-32b-instruct-w8a8
        - name: qwen3-32b-int8
    accuracy:
      nightly:
        - name: accuracy-group-1
  a3:
    multi_node:
      test_config:
        - name: multi-node-deepseek-v3.2-W8A8-EP
    double_node:
      test_config:
        - name: multi-node-qwen3-dp
        - name: multi-node-GLM-5.1-w8a8-A3
    single_node:
      test_config:
        - name: deepseek-r1-0528-w8a8
        - name: MiniMax-M3-BF16-A3
    multi_card:
      test_config:
        - name: qwen3-30b-acc
        - name: compressor-metadata-cross-stream
  a5:
    multi_node:
      test_config:
        # Currently disabled in nightly_config.yaml; resolve_hf_tests.py skips
        # it with a warning until the A5 multi-node case is enabled.
        - name: Qwen3-235B-W8A8-EPLB
    single_node:
      test_config:
        - name: Qwen3_32b_w8a8_A5
