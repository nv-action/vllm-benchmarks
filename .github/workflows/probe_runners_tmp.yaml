name: Probe Runners
on:
  push:
    branches: [czy_issue_public_test]
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner-label:
          - linux-amd64-cpu-8-hk
          - linux-aarch64-nightly-a3-16
          - linux-aarch64-nightly-a3-8
          - linux-aarch64-nightly-a3-2
          - linux-aarch64-a3-800i-4-cn12-001
          - linux-aarch64-a5-8
          - linux-aarch64-a5-0
          - linux-aarch64-a2b3-1
          - linux-aarch64-a2b3-2
          - linux-aarch64-a2b3-4
          - linux-aarch64-a2b3-8
          - linux-aarch64-310p-4
    runs-on: ${{ matrix.runner-label }}
    timeout-minutes: 3
    steps:
      - run: 'echo "ALIVE: ${{ matrix.runner-label }}" && hostname && uname -m'
