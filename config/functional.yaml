# 功能测试框架全局配置。
# 矩阵维度 = software × version × operating_systems × hardware。
# 版本白名单由各软件自己的 func_case.yaml 维护(人工指定,不做 latest 解析)。

architectures:
  - aarch64

# OS 维度。runtime 决定该 cell 的落地方式:
#   native        - 直接在宿主 Runner 上执行
#   container     - 在 Runner 内用 docker 起容器执行(需要 docker daemon)
#   job-container - 容器由 workflow job 的 container: 字段提供,四个阶段直接在容器内执行
# mode 决定容器内如何取得被测软件:
#   prebuilt - 使用预构建软件镜像(image_template 渲染),已装好软件,install 只校验
#   build    - 使用基础镜像(image),在容器内跑安装脚本(装依赖 + 构建)与测试脚本
# image_template 支持 {software}、{version}、{arch} 占位,
# 例:hub.oepkgs.net/openeuler/redis:8.10.2-oe2403sp4
# 预构建软件镜像走 openEuler 官方国内镜像站 hub.oepkgs.net(多架构 tag,不带 arch 后缀)。
operating_systems:
  - name: openeuler-24.03-sp4
    runtime: job-container
    mode: prebuilt
    image_template: "hub.oepkgs.net/openeuler/{software}:{version}-oe2403sp4"
  - name: ubuntu-26.04.1
    runtime: job-container
    mode: build
    # 直接使用 Docker Hub 官方镜像(实测节点可直连)。
    image: "ubuntu:26.04"

# 硬件维度。每台物理机对应一组自托管 Runner 标签,任务需同时匹配全部标签。
hardware:
  - name: kunpeng920
    runner_labels:
      - linux-aarch64-cpu-4
  - name: kunpeng950
    runner_labels:
      - linux-aarch64-a5-0

output_root: .func-output
work_root: /home/runner/boostkit-func
