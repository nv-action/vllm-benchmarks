# 上游 bytedance/bolt 不发布任何 GitHub release / tag(仓库 default_branch=main,
# README 说明默认 BUILD_VERSION=main),没有传统语义的"版本"。
# 统一以待测 commit 短 sha 作为版本基线:结果可复现、可回溯(main 是移动目标,
# 同一 version 名下代码会漂移,不入白名单)。
# 换测新 commit 时:更新下方 versions,并由镜像方提供对应的 openEuler 预构建镜像
# (镜像 tag 即该 commit 短 sha,镜像内含 BUILD_VERSION 文件)。
#
# Bolt(字节跳动 C++ 原生执行引擎,经 Apache Gluten 作为 Spark 后端集成)功能测试清单。
name: bolt
category: Bigdata
enabled: true

# 镜像源:本用例预构建镜像托管在 hub.oepkgs.net(openeuler 项目,多架构 tag
# 不带 -{arch} 后缀),与 config/functional.yaml 的 SWR 模板不同,此处按软件覆盖。
# 镜像:hub.oepkgs.net/openeuler/bolt:2d01261-oe2403sp4(OCI index,含 linux/arm64)
image_template: "hub.oepkgs.net/openeuler/{software}:{version}-oe2403sp4"
# 暂只跑 openEuler prebuilt cell;ubuntu build 模式为 6h 级重源码构建,待
# dedicated runner 资源确认后再放开(去掉本行即恢复跟随 config 全量 OS)。
operating_systems:
  - openeuler-24.03-sp4

# 人工指定的待测版本(白名单):commit 短 sha。
versions:
  - "2d01261"

# build 模式(FUNC_MODE=build)软件获取为分层优先:1) 上游官方二进制 2) 三方仓库包 3) 源码编译。
# Bolt 官方仅有源码(无二进制/镜像),层1/层2 无可用渠道,实际走层3(Conan+CMake 重构建);
# 版本校验以 git ref 为基准。

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  # Bolt 源码构建会用 Conan 从源码编译全部依赖(folly/Arrow 等),非常重;
  # build 模式 CONAN_OPTIONS 追加 enable_jit=False(砍掉 llvm-core/19.1.7-bolt,
  # 该依赖无任何公开二进制,源码编译 2.5h+)与 enable_paimon=False(砍掉
  # paimon-cpp 及其 avro 依赖链),两者均为上游一等公民可选项;
  # engine-smoke 准备阶段另有 10+20 分钟硬超时的重配置与定向构建。
  timeout_minutes: 360
  # Conan + CMake 完整构建 C++ 引擎,依赖与中间产物都很大。
  min_free_disk_gb: 24

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
# 两个模式(openEuler prebuilt / ubuntu build)跑完全相同的一组检查,无 skipped 语义。
checks:
  - name: version
    description: 校验源码 commit / 镜像内 BUILD_VERSION 等于请求版本(短 sha 与完整 sha 互为前缀即可匹配)
  - name: engine-smoke
    description: 在被测构建树(CMakeCache 复用,引擎对象不重编)上注入最小 CMake 消费者,链接树内 bolt 引擎目标并真实运行;install 阶段构建,check 阶段执行
    upstream_command: cmake --build <build_tree> --target bolt_func_smoke && ./bolt_func_smoke
  - name: link-smoke
    description: 最小可用性冒烟,校验构建产物 libbolt*.so 可被动态链接器加载,静态库以 ar 归档完整性检查替代

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  test_log:
    path: bolt_test.log
    stage: check
    format: text
    required: true