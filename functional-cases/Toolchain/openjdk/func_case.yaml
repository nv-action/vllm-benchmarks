# openjdk (OpenJDK) 功能测试清单。
# 独立于性能测试框架 framework/;版本由人工指定,不做 latest 解析。
name: openjdk
category: Toolchain
enabled: true

# 人工指定的待测版本(白名单)。版本串必须与 openEuler 预构建镜像 tag 中的版本段一致
# (镜像 tag = openeulertest/openjdk:{version}-oe2403sp4-{arch},仓库镜像以 {feature}_{build}
#  形式命名,如 28_19),因此这里写 "28_19"。
# 版本校验只比 feature 号:OpenJDK 的 java -version 对 GA 版输出 "27.0.1"、对 EA 版输出 "28-ea",
# 只有 feature 号是跨 GA/EA 稳定且可比的标识,故按请求版本的 feature 号(28_19 -> 28)比对。
versions:
  - "28_19"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  timeout_minutes: 90

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
# 判定来源:优先复用上游测试套件(upstream_command),不足时用内部 smoke 补齐。
# build 模式(FUNC_MODE=build,ubuntu 官方基础镜像内)按分层优先获取 JDK,每层都须匹配请求
# feature 号(28_19 -> 28),不匹配即降级:
#   层1 上游官方二进制 = jdk.java.net 发布的 OpenJDK 二进制(GA 与 EA 都在此页,附 .sha256)
#   → 层2 三方仓库包 = Adoptium Temurin 的版本化下载 API(GA 之前返回 404)
#   → 层3 源码编译 = 需引导 JDK 且耗时数小时,功能测试的 build 模式内结构性不可用。
checks:
  - name: version
    description: java -version 的 feature 号必须等于请求版本的 feature 号
  # JDK 自带测试依赖 jtreg 且耗时过长,改用 javac 编译 + java 运行的功能测试。
  - name: upstream-test
    description: javac 编译并 java 运行一个 Hello 程序
    upstream_command: javac Hello.java && java Hello
  - name: smoke
    description: java 运行一个使用 java.util.stream 的程序

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  check_log:
    path: check.log
    stage: check
    format: text
    required: true
