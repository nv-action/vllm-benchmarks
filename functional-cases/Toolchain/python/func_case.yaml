# python (CPython) 功能测试清单。
# 独立于性能测试框架 framework/;版本由人工指定,不做 latest 解析。
name: python
category: Toolchain
enabled: true

# 人工指定的待测版本(白名单),与 software/Toolchain/python/case.yaml 一致。
versions:
  - "3.15.0"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  timeout_minutes: 300
  # 源码编译(--enable-optimizations --with-lto):源码树 + 构建树 + 安装树。
  min_free_disk_gb: 10

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
# 判定来源:优先复用上游测试套件(upstream_command),不足时用内部 smoke 补齐。
# build 模式(FUNC_MODE=build,ubuntu 官方基础镜像内)按分层优先获取 CPython,每层版本需严格等于
# SOFTWARE_VERSION,不匹配则降级:层1 上游官方二进制(python.org 仅源码,不可用)→
# 层2 python-build-standalone(astral 维护、uv 同源的 CPython 独立构建,提供 aarch64 预编译包)→
# 层3 三方仓库包(apt python3.14)→ 层4 官方源码 tarball 编译。
checks:
  - name: version
    description: 获取到的 CPython 解释器版本必须等于请求版本(层1/2/3/4 任一来源均须匹配)
  # 上游测试套件:运行 CPython 官方回归测试的子集(test.regrtest)。
  - name: upstream-test
    description: 运行 CPython 官方回归测试子集(test_math / test_json)
    upstream_command: python3 -m test -q test_math test_json
  - name: smoke
    description: compileall 临时目录 + 运行内建模块断言

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  check_log:
    path: check.log
    stage: check
    format: text
    required: true