# hnswlib 功能测试清单。
# 独立于性能测试框架 software/AI/hnswlib/;版本由人工指定,不做 latest 解析。
name: hnswlib
category: AI
enabled: true

# 人工指定的待测版本(白名单),与 software/AI/hnswlib/case.yaml 保持一致。
versions:
  - "0.9.0"
  - "0.8.0"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  timeout_minutes: 60

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
# hnswlib 上游的主体形态是 header-only C++ 库,Python 绑定只是附加组件,因此这里统一按
# C++ 形态验证(prebuilt 与 build 两条路径的判据相同,都用 g++ 编译并运行 HNSW 核心 API)。
# 头文件没有版本宏,版本识别用整套头文件的聚合 SHA-256 指纹(见 common.sh)。
# build 模式分层优先获取:上游官方 tarball → 三方仓库产物(无)C++ 头文件包 → git 源码兜底;
# prebuilt 模式直接使用镜像里 /usr/local/include/hnswlib 下的头文件。
checks:
  - name: version
    description: 安装的 hnswlib 头文件必须是请求版本(整套头文件的聚合 SHA-256 指纹比对)
  - name: hnsw-knn-roundtrip
    description: g++ 编译并运行 HNSW addPoint/searchKnn 回环,校验自查询全命中与插值查询标签
  - name: hnsw-save-reload
    description: 索引 saveIndex 落盘后重新加载,校验加载后的检索结果一致

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  functional_log:
    path: functional_test.log
    stage: check
    format: text
    required: true
