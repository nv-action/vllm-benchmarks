# Ceph 功能测试清单。
name: ceph
category: Storage
# 临时禁用:全量功能测试跳过该软件。
enabled: false

# build 模式(Ubuntu 26.04)从预构建镜像导出根文件系统复用同一份软件本体:
# Ceph 官方仓库只发布 bookworm/jammy/noble/trixie 包,没有 Ubuntu 26.04(resolute)
# 对应的 21.3.0/16.2.8 二进制,现场安装只能退到源码编译(远超时限)。
# 声明 bootstrap_image 后,框架在运行机上 docker export 该镜像并解包到工作目录,
# 通过 PERF_IMAGE_ROOTFS 传给用例,用例用 chroot 直接运行镜像内已装好的 ceph。
bootstrap_image: "docker.1ms.run/openeulertest/{software}:{version}-oe2403sp4-{arch}"

# 人工指定的待测版本(白名单),与预构建镜像 tag 一一对应。
versions:
  - "21.3.0"
  - "16.2.8"

# build 模式(FUNC_MODE=build)软件获取为分层优先:1) 上游官方二进制 tarball 2) 厂商/发行版
# 仓库中版本一致的包 3) 源码编译。Ceph 官方无二进制 tarball(仅源码 tarball),官方镜像
# quay.io/ceph/ceph 因 build 模式无嵌套 docker 不可用,故实际以官方仓库包等效,最后退源码编译;
# 每层均用 ceph --version 校验版本。声明了 bootstrap_image 时直接复用镜像根文件系统,
# 不再走上述分层。

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  timeout_minutes: 120
  # 预构建镜像本身(约 5 GiB)+ 导出的根文件系统副本(未压缩,可能 10 GiB 级);
  # 源码编译 ceph 同样体量很大。
  min_free_disk_gb: 30

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
# 判定来源:上游离线自检工具 + 最小可用性(完整集群引导很重,详见 detail)。
checks:
  - name: version
    description: ceph --version 必须等于请求版本
  - name: upstream-test
    description: 运行上游自带离线自检工具 ceph-dencoder 与 monmaptool
    upstream_command: ceph-dencoder types list
  - name: cluster-smoke
    description: 最小可用性冒烟,校验 ceph-mon/ceph-osd/ceph-mgr 二进制可执行(不引导完整集群)

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  smoke_log:
    path: ceph_smoke.log
    stage: check
    format: text
    required: true