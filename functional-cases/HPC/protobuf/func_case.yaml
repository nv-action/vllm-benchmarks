# Protobuf 功能测试清单。
# 独立于性能测试框架;版本由人工指定,不做 latest 解析。
name: protobuf
category: HPC
enabled: true

# build 模式(ubuntu 基础镜像内)分层优先获取:层1 官方 protoc 预编译二进制 release 资产 →
#   层2 apt 中版本严格等于目标版本的 protobuf 包 → 层3 源码编译;每层产物都校验 protoc 版本。

# 人工指定的待测版本(白名单),与 software/HPC/protobuf/case.yaml 保持一致。
versions:
  - "36.2"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  timeout_minutes: 120

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
checks:
  - name: version
    description: 分层获取后 protoc 版本必须严格等于请求版本
  # 用 protoc 编译上游源码树自带的 google/protobuf/descriptor.proto,
  # 再用同一 protoc 把 descriptor_set 解码回文本,校验编译器自洽。
  - name: upstream-test
    description: protoc 编译并回解上游 descriptor.proto(frontend 自洽)
    upstream_command: protoc --descriptor_set_out=... google/protobuf/descriptor.proto
  - name: cpp-roundtrip
    description: protoc 生成 C++ 代码后编译链接 libprotobuf 做序列化/反序列化回环

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  protobuf_test_log:
    path: protobuf_test.log
    stage: check
    format: text
    required: true