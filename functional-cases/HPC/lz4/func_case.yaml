# LZ4 功能测试清单。
# 独立于性能测试框架;版本由人工指定,不做 latest 解析。
name: lz4
category: HPC
enabled: true
# 两个版本的来源不同:hub.oepkgs.net 只有 1.9.3,1.10.0 只在 SWR 上,故按版本指定模板。
image_template:
  "1.9.3": "hub.oepkgs.net/openeuler/{software}:{version}-oe2403sp4"
  "1.10.0": "swr.cn-southwest-2.myhuaweicloud.com/base_image/lzr/{software}:{version}-oe2403sp4-{arch}"

# 人工指定的待测版本(白名单),由人工维护;
# 不要求与 software/HPC/lz4/case.yaml 一致,可含更高或额外版本。
versions:
  - "1.10.0"
  - "1.9.3"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  timeout_minutes: 30

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
checks:
  - name: version
    description: 被测 lz4 版本必须等于请求版本
  # 上游 lz4 仓库自带 tests/Makefile 回归套件;prebuilt 模式浅克隆源码树并把镜像内
  # lz4 软链到树的 programs/lz4,build 模式直接用本次编译出的源码树。
  - name: upstream-test
    description: 运行上游 lz4 tests/Makefile 的核心回归子集
    upstream_command: make -C tests test-lz4-essentials
  - name: cli-roundtrip
    description: lz4 CLI 压缩/解压回环并按 sha256 校验内容一致

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  lz4_test_log:
    path: lz4_test.log
    stage: check
    format: text
    required: true